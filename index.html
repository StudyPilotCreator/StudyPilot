<style>
:root{color-scheme:dark;--bg:#0d1020;--surface:rgba(27,31,55,.72);--surface2:rgba(39,43,72,.74);--line:rgba(201,204,255,.13);--ink:#f7f7ff;--muted:#a5abc7;--purple:#a69aff;--mint:#82ead0;--yellow:#ffd48a;--pink:#ffa5c2;--shadow:0 20px 60px #0507145c}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 7% 0%,#3a2a66 0,transparent 38%),radial-gradient(ellipse at 95% 23%,#173d50 0,transparent 34%),var(--bg);background-attachment:fixed}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--purple);outline-offset:2px}.app{max-width:1080px;margin:0 auto;padding:26px 18px calc(112px + env(safe-area-inset-bottom))}.glass{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.brandmark{height:46px;width:46px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#b6aaff,#7764ec);color:#fff;font-size:23px;box-shadow:0 8px 28px #8874ff4d}.brandname{font-size:20px;font-weight:850;letter-spacing:-.7px}.tagline{font-size:10px;letter-spacing:1.7px;color:var(--muted);margin-top:3px}.date-stamp{text-align:right;color:var(--muted);font-size:12px}.view{animation:appear .35s ease both}.hero{position:relative;overflow:hidden;padding:28px;border-radius:28px;margin-bottom:16px}.hero:before{content:"";position:absolute;width:230px;height:230px;background:#9c87ff28;filter:blur(8px);border-radius:50%;right:-65px;top:-90px;animation:float 8s ease-in-out infinite;pointer-events:none}.eyebrow{color:#c0b7ff;letter-spacing:1.8px;text-transform:uppercase;font-size:10px;font-weight:850}.hero h1{font-size:clamp(33px,6vw,54px);line-height:1.02;letter-spacing:-2.3px;margin:12px 0 12px;max-width:640px}.hero p{max-width:550px;color:var(--muted);line-height:1.65;font-size:14px}.hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:13px;padding:11px 15px;color:var(--ink);font-weight:750;transition:transform .18s,background .18s}.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.1)}.btn.primary{border:0;color:#17142c;background:linear-gradient(130deg,#c6bdff,#8f80ff);box-shadow:0 7px 22px #8771ff35}.btn.mint{background:linear-gradient(130deg,#a3f4df,#70dfc1);color:#09251f;border:0}.btn.danger{color:#ffc1ce}.btn.small{padding:8px 10px;font-size:12px;border-radius:10px}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:16px}.panel{padding:21px;border-radius:23px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel h2{font-size:18px;letter-spacing:-.55px;margin:0}.muted{color:var(--muted)}.small-text{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{padding:14px;border-radius:17px;background:rgba(255,255,255,.045);border:1px solid var(--line)}.stat-icon{font-size:20px}.stat-number{font-size:23px;font-weight:850;letter-spacing:-.8px;margin-top:8px}.stat-label{font-size:11px;color:var(--muted);margin-top:2px}.progress-line{height:7px;background:#363956;border-radius:99px;overflow:hidden;margin-top:9px}.progress-fill{height:100%;background:linear-gradient(90deg,#ab9aff,#7ce8ca);border-radius:99px;transition:width .3s}.rows{display:flex;flex-direction:column;gap:9px}.row-card{display:flex;align-items:center;gap:11px;padding:12px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid var(--line);min-width:0}.row-emoji{width:38px;height:38px;flex:0 0 38px;border-radius:13px;display:grid;place-items:center;background:rgba(166,154,255,.13);font-size:18px}.row-main{min-width:0;flex:1}.row-title{font-weight:760;font-size:13px;overflow-wrap:anywhere}.row-meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}.time-pill{font-size:11px;color:#d6d0ff;font-weight:800;white-space:nowrap}.empty{border:1px dashed #515678;border-radius:15px;padding:22px 15px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.check{border:1.5px solid #757a9f;background:transparent;border-radius:8px;width:22px;height:22px;flex:0 0 22px;color:#111;border-color:#757a9f;padding:0}.task-done .check{background:var(--mint);border-color:var(--mint)}.task-done .row-title{text-decoration:line-through;opacity:.6}.task-done{opacity:.62}.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--muted);border-radius:10px;padding:6px 9px}.priority{font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.4px;border-radius:7px;padding:5px 7px}.priority.Hoch{background:#4b2a43;color:#ffb6c7}.priority.Mittel{background:#463b2d;color:#ffd58e}.priority.Niedrig{background:#1e403c;color:#9bf2d8}.section-title{font-size:23px;letter-spacing:-1px;margin:0 0 5px}.page-intro{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px}.calendar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.month-title{font-size:21px;font-weight:850;letter-spacing:-.8px}.month-controls{display:flex;gap:7px}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{font-size:10px;color:var(--muted);text-align:center;padding:5px 0}.day-cell{border:1px solid transparent;background:rgba(255,255,255,.035);color:var(--ink);border-radius:12px;min-height:58px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:6px}.day-cell.dim{opacity:.32}.day-cell.selected{border-color:#b3a7ff;background:#8d7cff29}.day-cell.today .day-number{background:#b2a7ff;color:#17142a}.day-number{border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:11px;font-weight:800}.dots{display:flex;gap:3px;height:5px}.dot{height:5px;width:5px;border-radius:50%;background:var(--mint)}.day-detail{margin-top:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;min-width:0;border-radius:12px;padding:11px 12px;color:var(--ink);background:#11152a;border:1px solid #343957}.field textarea{resize:vertical;min-height:75px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.days{display:flex;gap:7px;flex-wrap:wrap}.day-toggle{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:10px;padding:9px 11px;font-size:12px}.day-toggle input{accent-color:#a69aff}.modal-backdrop{position:fixed;inset:0;background:#070916b8;backdrop-filter:blur(12px);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;animation:appear .2s ease}.modal{width:min(100%,500px);max-height:88vh;overflow:auto;border-radius:25px;padding:22px;background:rgba(25,29,51,.96);border:1px solid var(--line);box-shadow:0 30px 100px #0009}.modal h2{margin:0 0 6px;font-size:22px}.modal p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:15px;padding:18px 8px;text-align:center;color:var(--ink)}.choice span{display:block;font-size:25px;margin-bottom:8px}.choice strong{font-size:12px}.bottom-nav{position:fixed;z-index:10;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),520px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px;border-radius:23px;background:rgba(22,25,44,.78);border:1px solid rgba(220,220,255,.17);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 15px 60px #0007}.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;color:#989fbd;background:transparent;border-radius:16px;min-height:55px;padding:5px 2px;font-size:10px;font-weight:750}.nav-icon{font-size:19px;line-height:1}.nav-item.active{background:rgba(157,143,255,.16);color:#c9c0ff}.nav-item.new{background:linear-gradient(145deg,#b6aaff,#8974ff);color:#16142a}.toast{position:fixed;z-index:30;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#d9fff2;color:#12382c;border-radius:13px;padding:11px 15px;font-size:12px;font-weight:800;box-shadow:0 12px 35px #0006;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}.setup-wrap{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:18px 0}.setup-card{width:min(100%,680px);border-radius:30px;padding:clamp(22px,5vw,38px);position:relative;overflow:hidden}.setup-card:before{content:"";position:absolute;right:-90px;top:-100px;width:250px;height:250px;border-radius:50%;background:#9683ff25;filter:blur(6px);animation:float 9s ease-in-out infinite;pointer-events:none}.setup-logo{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#b6aaff,#7764ec);font-size:27px;box-shadow:0 12px 30px #7968e74a;animation:float 5s ease-in-out infinite}.setup-card h1{font-size:clamp(31px,6vw,48px);line-height:1.04;letter-spacing:-1.8px;margin:18px 0 12px}.setup-card>p{color:var(--muted);font-size:14px;line-height:1.65;max-width:530px}.stepper{display:flex;gap:6px;margin:25px 0 28px}.step-line{height:4px;flex:1;border-radius:99px;background:#363954}.step-line.on{background:linear-gradient(90deg,#a99aff,#7de6ca)}.setup-content{position:relative;animation:appear .3s ease}.setup-content h2{font-size:20px;margin:0 0 7px}.setup-content .hint{color:var(--muted);font-size:12px;line-height:1.55;margin:0 0 17px}.setup-buttons{display:flex;justify-content:space-between;gap:9px;margin-top:24px}.routine-form{margin-top:16px;padding:14px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid var(--line)}.routine-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.routine-chip{display:flex;align-items:center;gap:7px;border-radius:10px;padding:8px 10px;background:#302b50;border:1px solid #514873;font-size:11px}.routine-chip button{border:0;background:transparent;color:#ffc5ce;font-weight:900}.setup-recap{display:grid;gap:10px}.recap-item{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid var(--line)}.recap-item span:first-child{font-size:22px}.recap-item strong{display:block;font-size:13px}.recap-item small{color:var(--muted);font-size:11px;display:block;margin-top:3px}
@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(13px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:760px){.app{padding:20px 13px calc(100px + env(safe-area-inset-bottom))}.topbar{margin-bottom:18px}.grid{grid-template-columns:1fr}.hero{padding:23px;border-radius:23px}.panel{padding:17px;border-radius:20px}.stats{gap:7px}.stat{padding:11px}.stat-number{font-size:20px}.day-cell{min-height:47px;padding:4px 1px;gap:3px;border-radius:9px}.day-number{width:24px;height:24px}.month-title{font-size:19px}.weekday{font-size:9px}.bottom-nav{bottom:calc(8px + env(safe-area-inset-bottom))}.nav-item{font-size:9px;min-height:51px}.form-grid{grid-template-columns:1fr 1fr}.setup-wrap{min-height:calc(100vh - 45px)}.setup-card{padding:23px 18px;border-radius:25px}}@media(max-width:390px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.choice-grid{gap:6px}.choice{padding:14px 3px}.brandname{font-size:18px}.tagline{font-size:9px}.day-cell{min-height:42px}.day-number{font-size:10px}}

<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
const KEY="studypilot.v4.data";
const DAY_NAMES=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const DAY_SHORT=["Mo","Di","Mi","Do","Fr","Sa","So"];
const $=id=>document.getElementById(id);
const today=new Date(); today.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseDate=s=>{const p=String(s||iso(today)).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const deDate=d=>new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"}).format(d);
const monthName=d=>new Intl.DateTimeFormat("de-DE",{month:"long",year:"numeric"}).format(d);
const mondayIndex=d=>(d.getDay()+6)%7;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const timeM=s=>{const p=String(s||"00:00").split(":").map(Number);return p[0]*60+p[1];};
const addM=(time,duration)=>{const n=timeM(time)+Number(duration||0);return String(Math.floor(n/60)%24).padStart(2,"0")+":"+String(n%60).padStart(2,"0");};
const fmtTime=n=>String(Math.floor(n/60)%24).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
const defaultData=()=>({setupDone:false,school:{days:[0,1,2,3,4],start:"08:00",end:"13:00"},routines:[],tasks:[],events:[],selectedDate:iso(today),introSeen:false});
let data;
try{data=Object.assign(defaultData(),JSON.parse(localStorage.getItem(KEY)||"{}"));if(!data.school)data.school=defaultData().school;if(!Array.isArray(data.routines))data.routines=[];if(!Array.isArray(data.tasks))data.tasks=[];if(!Array.isArray(data.events))data.events=[];}catch(e){data=defaultData();}
let setupStep=0;
let draftSchool=JSON.parse(JSON.stringify(data.school));
let draftRoutines=Array.isArray(data.routines)?data.routines.slice():[];
let currentView="today";
let visibleMonth=new Date(today.getFullYear(),today.getMonth(),1);
let selectedDate=data.selectedDate||iso(today);
let toastTimer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){notify("Speichern im Browser war nicht möglich.");}}
function notify(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2100);}
function setDate(s){selectedDate=s;data.selectedDate=s;save();}
function button(label,action,cls){return '<button class="btn '+(cls||"")+'" data-action="'+action+'">'+label+'</button>';}
function field(label,id,type,value,attrs,full){return '<div class="field '+(full?"full":"")+'"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+esc(value||"")+'" '+(attrs||"")+'></div>';}
function dayChecks(selected){return '<div class="days">'+DAY_NAMES.map((n,i)=>'<label class="day-toggle"><input type="checkbox" class="day-check" value="'+i+'" '+(selected.includes(i)?"checked":"")+'> '+DAY_SHORT[i]+'</label>').join("")+'</div>';}
function renderSetup(){
const stepTitles=["Willkommen bei StudyPilot","Dein Stundenplan","Sport & regelmäßige Termine","Dein persönlicher Wochenplan"];
let body="";
if(setupStep===0)body='<div class="setup-content"><div class="setup-logo">✦</div><div class="eyebrow" style="margin-top:22px">Dein Tag. Dein Tempo.</div><h1>Weniger Chaos.<br>Mehr Zeit für dich.</h1><p>StudyPilot hilft dir, Schule, Hausaufgaben, Sport und Freizeit in einen realistischen Wochenplan zu bringen. Wir richten zuerst deine Woche ein — danach erstellt die App daraus deinen persönlichen Überblick.</p><div class="stats"><div class="stat"><div class="stat-icon">📚</div><div class="stat-label">Schule im Blick</div></div><div class="stat"><div class="stat-icon">⚽</div><div class="stat-label">Hobbys einplanen</div></div><div class="stat"><div class="stat-icon">🔒</div><div class="stat-label">Lokal gespeichert</div></div></div><p class="small-text">Ohne Konto. Keine KI-API. Deine Einrichtung wird in diesem Browser auf diesem Gerät gespeichert.</p></div>';
if(setupStep===1)body='<div class="setup-content"><div class="eyebrow">Schritt 1 von 3</div><h2>Wann hast du Schule?</h2><p class="hint">Wähle deine Schultage und trage die ungefähre Start- und Endzeit ein. Die Voreinstellung Mo–Fr ist nur ein Beispiel — du kannst alles ändern.</p><div class="field"><label>Schultage</label>'+dayChecks(draftSchool.days||[0,1,2,3,4])+'</div><div class="form-grid" style="margin-top:17px">'+field("Schulbeginn","school-start","time",draftSchool.start||"08:00",'required',false)+field("Schulende","school-end","time",draftSchool.end||"13:00",'required',false)+'</div><p class="small-text" style="margin-top:13px">Wenn dein Stundenplan je nach Wochentag unterschiedlich ist, kannst du später einzelne Termine im Kalender ergänzen.</p></div>';
if(setupStep===2)body='<div class="setup-content"><div class="eyebrow">Schritt 2 von 3</div><h2>Was machst du regelmäßig?</h2><p class="hint">Füge Sporttraining, Musikunterricht, Verein oder andere wiederkehrende Aktivitäten hinzu. Du kannst mehrere Tage auswählen.</p><div class="routine-form"><form id="setup-routine-form"><div class="form-grid">'+field("Aktivität","draft-title","text","","placeholder=\"z. B. Fußballtraining\" maxlength=\"70\" required",true)+field("Beginn","draft-start","time","17:00","required",false)+field("Dauer (Minuten)","draft-duration","number","90","min=\"10\" max=\"600\" step=\"5\" required",false)+'<div class="field full"><label>Wiederholt sich an</label>'+dayChecks([1])+'</div><div class="field full"><label for="draft-category">Kategorie</label><select id="draft-category"><option>Sport</option><option>Musik</option><option>Verein</option><option>Familie</option><option>Sonstiges</option></select></div></div><div class="form-actions"><button class="btn mint" type="submit">＋ Aktivität hinzufügen</button></div></form></div><div class="routine-chips">'+(draftRoutines.length?draftRoutines.map(r=>'<span class="routine-chip"> '+esc(r.emoji||"✦")+' '+esc(r.title)+' · '+esc(DAY_SHORT[r.day])+' '+esc(r.start)+' <button type="button" data-action="draft-delete" data-id="'+esc(r.id)+'" aria-label="Aktivität entfernen">×</button></span>').join(""):'<span class="small-text">Noch keine Aktivitäten hinzugefügt. Du kannst diesen Schritt auch überspringen.</span>')+'</div></div>';
if(setupStep===3)body='<div class="setup-content"><div class="eyebrow">Schritt 3 von 3</div><h2>Deine Woche ist startklar.</h2><p class="hint">So wird StudyPilot deine Woche strukturieren. Du kannst alle Angaben später bearbeiten.</p><div class="setup-recap"><div class="recap-item"><span>📚</span><div><strong>Schule</strong><small>'+esc((draftSchool.days||[]).map(i=>DAY_NAMES[i]).join(", ")||"Keine festen Schultage")+' · '+esc(draftSchool.start)+'–'+esc(draftSchool.end)+'</small></div></div><div class="recap-item"><span>⚽</span><div><strong>Regelmäßige Aktivitäten</strong><small>'+draftRoutines.length+' eingetragen'+(draftRoutines.length?" · "+esc(draftRoutines.map(r=>r.title).slice(0,3).join(", ")):" — jederzeit später ergänzbar")+'</small></div></div><div class="recap-item"><span>🔐</span><div><strong>Deine Daten</strong><small>Bleiben in diesem Browser auf diesem Gerät. Keine automatische Synchronisierung.</small></div></div></div></div>';
$("root").innerHTML='<main class="app"><div class="setup-wrap"><section class="setup-card glass"><div class="stepper">'+[0,1,2,3].map(i=>'<span class="step-line '+(i<=setupStep?"on":"")+'"></span>').join("")+'</div>'+body+'<div class="setup-buttons">'+(setupStep>0?'<button class="btn" data-action="setup-back">← Zurück</button>':'<span></span>')+(setupStep<3?'<button class="btn primary" data-action="setup-next">'+(setupStep===0?"Einrichtung starten →":setupStep===1?"Weiter zu deinen Hobbys →":"Zur Übersicht →")+'</button>':'<button class="btn mint" data-action="setup-finish">StudyPilot starten ✨</button>')+'</div></section></div></main>';
}
function allItems(dateString){
const date=parseDate(dateString),dow=mondayIndex(date),items=[];
if(data.school.days.includes(dow))items.push({id:"school-"+dateString,title:"Schule",start:data.school.start,end:data.school.end,category:"Schule",emoji:"📚",kind:"school"});
data.routines.filter(r=>Number(r.day)===dow).forEach(r=>items.push({id:"routine-"+r.id,title:r.title,start:r.start,end:addM(r.start,r.duration),category:r.category||"Aktivität",emoji:r.emoji||"✦",kind:"routine"}));
data.events.filter(e=>e.date===dateString).forEach(e=>items.push({id:"event-"+e.id,title:e.title,start:e.start||"12:00",end:e.end||addM(e.start||"12:00",e.duration||60),category:e.category||"Termin",emoji:e.emoji||"📅",kind:"event",notes:e.notes||""}));
return items.sort((a,b)=>timeM(a.start)-timeM(b.start));
}
function tasksFor(dateString){return data.tasks.filter(t=>t.date===dateString).sort((a,b)=>({"Hoch":0,"Mittel":1,"Niedrig":2}[a.priority]||0)-({"Hoch":0,"Mittel":1,"Niedrig":2}[b.priority]||0));}
function renderTimeline(dateString){
const items=allItems(dateString);
return items.length?'<div class="rows">'+items.map(it=>'<div class="row-card"><div class="row-emoji">'+esc(it.emoji)+'</div><div class="row-main"><div class="row-title">'+esc(it.title)+'</div><div class="row-meta">'+esc(it.category)+(it.notes?" · "+esc(it.notes):"")+'</div></div><span class="time-pill">'+esc(it.start)+'–'+esc(it.end)+'</span></div>').join("")+'</div>':'<div class="empty">Für diesen Tag gibt es noch keine festen Termine.<br>Füge eine Aktivität oder einen Termin hinzu. ✨</div>';
}
function renderTasks(dateString){
const tasks=tasksFor(dateString);
return tasks.length?'<div class="rows">'+tasks.map(t=>'<div class="row-card '+(t.done?"task-done":"")+'"><button class="check" data-action="task-toggle" data-id="'+esc(t.id)+'" aria-label="Aufgabe abhaken">'+(t.done?"✓":"")+'</button><div class="row-main"><div class="row-title">'+esc(t.title)+'</div><div class="row-meta">'+Number(t.duration||25)+' Min. · '+esc(t.priority||"Mittel")+'</div></div><span class="priority '+esc(t.priority||"Mittel")+'">'+esc(t.priority||"Mittel")+'</span><button class="icon-btn" data-action="task-delete" data-id="'+esc(t.id)+'" aria-label="Aufgabe löschen">×</button></div>').join("")+'</div>':'<div class="empty">Noch keine Aufgaben für diesen Tag.<br>Füge eine kleine Aufgabe hinzu und starte los. 🌱</div>';
}
function renderToday(){
const open=data.tasks.filter(t=>!t.done),done=data.tasks.filter(t=>t.done).length,total=data.tasks.length,minutes=open.reduce((s,t)=>s+Number(t.duration||25),0);
const greeting=(new Date().getHours()<11?"Guten Morgen":new Date().getHours()<18?"Hallo":"Guten Abend");
return '<section class="view"><section class="hero glass"><div class="eyebrow">'+esc(greeting)+' · DEIN PERSÖNLICHER PLANER</div><h1>Dein Tag.<br>Dein Tempo.</h1><p>'+esc(deDate(today))+'. Plane Schule, Hobbys und deine Aufgaben — mit genug Platz zum Durchatmen.</p><div class="hero-actions">'+button('＋ Aufgabe hinzufügen','new-task','primary')+button('＋ Termin hinzufügen','new-event','')+'</div></section><div class="stats"><div class="stat"><div class="stat-icon">⏳</div><div class="stat-number">'+minutes+'</div><div class="stat-label">Min. offene Aufgaben</div></div><div class="stat"><div class="stat-icon">✧</div><div class="stat-number">'+(done*25)+' XP</div><div class="stat-label">Fortschritt</div></div><div class="stat"><div class="stat-icon">🗓️</div><div class="stat-number">'+allItems(iso(today)).length+'</div><div class="stat-label">Termine heute</div></div></div><div class="progress-line"><div class="progress-fill" style="width:'+(total?Math.round(done/total*100):0)+'%"></div></div><div class="grid" style="margin-top:17px"><section class="panel glass"><div class="panel-head"><h2>Dein Tagesplan</h2><span class="small-text">'+esc(new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"short"}).format(today))+'</span></div>'+renderTimeline(iso(today))+'</section><section class="panel glass"><div class="panel-head"><h2>Deine Aufgaben</h2><span class="small-text">'+done+'/'+total+' erledigt</span></div>'+renderTasks(iso(today))+'</section></div></section>';
}
function renderCalendar(){
const first=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth(),1),startOffset=mondayIndex(first),daysCount=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()+1,0).getDate();
let cells="";
for(let i=0;i<42;i++){const dayNum=i-startOffset+1;const date=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth(),dayNum);const key=iso(date),inside=date.getMonth()===visibleMonth.getMonth(),active=key===selectedDate,istoday=key===iso(today);const count=allItems(key).length+tasksFor(key).length;cells+='<button class="day-cell '+(!inside?"dim ":"")+(active?"selected ":"")+(istoday?"today":"")+'" data-action="select-date" data-date="'+key+'"><span class="day-number">'+date.getDate()+'</span><span class="dots">'+(count?'<i class="dot"></i>':"")+(count>2?'<i class="dot" style="background:var(--purple)"></i>':"")+'</span></button>';}
const d=parseDate(selectedDate);
return '<section class="view"><h1 class="section-title">Dein Kalender</h1><p class="page-intro">Dein Stundenplan, wiederkehrende Aktivitäten und eigene Termine — alles in einer Übersicht.</p><section class="panel glass"><div class="calendar-top"><div class="month-title">'+esc(monthName(visibleMonth))+'</div><div class="month-controls"><button class="icon-btn" data-action="month-prev" aria-label="Vorheriger Monat">‹</button><button class="icon-btn" data-action="month-today">Heute</button><button class="icon-btn" data-action="month-next" aria-label="Nächster Monat">›</button></div></div><div class="month-grid">'+DAY_SHORT.map(n=>'<div class="weekday">'+n+'</div>').join("")+cells+'</div><div class="day-detail"><div class="panel-head"><h2>'+esc(deDate(d))+'</h2><button class="btn small primary" data-action="new-event">＋ Termin</button></div>'+renderTimeline(selectedDate)+'<div style="height:14px"></div><div class="panel-head"><h2>Aufgaben</h2><button class="btn small" data-action="new-task">＋ Aufgabe</button></div>'+renderTasks(selectedDate)+'</div></section></section>';
}
function renderRoutines(){
return '<section class="view"><h1 class="section-title">Deine Routinen</h1><p class="page-intro">Einmal eintragen, jede Woche sehen. Hier verwaltest du deine Schulzeiten und regelmäßigen Aktivitäten.</p><section class="panel glass"><div class="panel-head"><h2>Schule</h2><button class="btn small" data-action="edit-school">Bearbeiten</button></div><div class="row-card"><div class="row-emoji">📚</div><div class="row-main"><div class="row-title">'+esc((data.school.days||[]).map(i=>DAY_SHORT[i]).join(" · ")||"Keine festen Schultage")+'</div><div class="row-meta">Wiederholt sich jede Woche</div></div><span class="time-pill">'+esc(data.school.start)+'–'+esc(data.school.end)+'</span></div></section><section class="panel glass" style="margin-top:15px"><div class="panel-head"><h2>Sport & regelmäßige Termine</h2><button class="btn small primary" data-action="new-routine">＋ Hinzufügen</button></div>'+(data.routines.length?'<div class="rows">'+data.routines.slice().sort((a,b)=>a.day-b.day||timeM(a.start)-timeM(b.start)).map(r=>'<div class="row-card"><div class="row-emoji">'+esc(r.emoji||"✦")+'</div><div class="row-main"><div class="row-title">'+esc(r.title)+'</div><div class="row-meta">'+esc(DAY_NAMES[r.day])+' · '+esc(r.category||"Aktivität")+' · '+Number(r.duration)+' Minuten</div></div><span class="time-pill">'+esc(r.start)+'–'+esc(addM(r.start,r.duration))+'</span><button class="icon-btn" data-action="routine-delete" data-id="'+esc(r.id)+'" aria-label="Routine löschen">×</button></div>').join("")+'</div>':'<div class="empty">Noch keine regelmäßigen Aktivitäten hinzugefügt.<br>Füge Sport, Musikunterricht oder einen Verein hinzu.</div>')+'</section></section>';
}
function renderSettings(){
return '<section class="view"><h1 class="section-title">Einstellungen</h1><p class="page-intro">Passe StudyPilot an dich an. Deine Daten bleiben lokal auf diesem Gerät.</p><section class="panel glass"><div class="panel-head"><h2>Stundenplan bearbeiten</h2></div><form id="school-edit-form"><div class="field"><label>Schultage</label>'+dayChecks(data.school.days||[])+'</div><div class="form-grid" style="margin-top:15px">'+field("Beginn","edit-school-start","time",data.school.start,"required",false)+field("Ende","edit-school-end","time",data.school.end,"required",false)+'</div><div class="form-actions"><button class="btn primary" type="submit">Stundenplan speichern</button></div></form></section><section class="panel glass" style="margin-top:15px"><div class="panel-head"><h2>Deine Daten</h2></div><p class="small-text" style="line-height:1.65">Alles wird im lokalen Speicher dieses Browsers gespeichert. Ohne Export werden Daten nicht auf andere Geräte übertragen.</p><div class="hero-actions"><button class="btn" data-action="export-data">Daten exportieren</button><button class="btn" data-action="import-data">Backup importieren</button><button class="btn danger" data-action="restart-setup">Einrichtung erneut starten</button></div><input type="file" id="import-file" accept="application/json,.json" hidden></section></section>';
}
function renderApp(){
if(!data.setupDone){renderSetup();return;}
const page=currentView==="today"?renderToday():currentView==="calendar"?renderCalendar():currentView==="routines"?renderRoutines():renderSettings();
$("root").innerHTML='<main class="app"><header class="topbar"><div class="brand"><div class="brandmark">✦</div><div><div class="brandname">StudyPilot</div><div class="tagline">DEIN TAG. DEIN TEMPO.</div></div></div><div class="date-stamp">'+esc(new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"numeric",month:"short"}).format(today))+'<br><span>Dein persönlicher Plan</span></div></header>'+page+'</main><nav class="bottom-nav glass" aria-label="Hauptnavigation">'+navItem("today","◷","Heute")+navItem("calendar","▦","Kalender")+navItem("routines","✦","Routinen")+'<button class="nav-item new" data-action="new-menu"><span class="nav-icon">＋</span><span>Neu</span></button>'+navItem("settings","⚙","Mehr")+'</nav>';
}
function navItem(view,icon,label){return '<button class="nav-item '+(currentView===view?"active":"")+'" data-action="nav" data-view="'+view+'"><span class="nav-icon">'+icon+'</span><span>'+label+'</span></button>';}
function modal(html){const old=document.querySelector(".modal-backdrop");if(old)old.remove();document.body.insertAdjacentHTML("beforeend",'<div class="modal-backdrop" data-action="modal-close-backdrop"><section class="modal glass" role="dialog" aria-modal="true">'+html+'</section></div>');}
function closeModal(){const el=document.querySelector(".modal-backdrop");if(el)el.remove();}
function openNewMenu(){modal('<h2>Was möchtest du hinzufügen?</h2><p>Wähle aus, was in deinen persönlichen Plan soll.</p><div class="choice-grid"><button class="choice" data-action="new-task"><span>✅</span><strong>Aufgabe</strong></button><button class="choice" data-action="new-event"><span>📅</span><strong>Termin</strong></button><button class="choice" data-action="new-routine"><span>🔁</span><strong>Routine</strong></button></div><div class="form-actions"><button class="btn" data-action="modal-close">Schließen</button></div>');}
function openTaskForm(){
modal('<h2>Neue Aufgabe</h2><p>Trage ein, was du erledigen möchtest.</p><form id="task-form"><div class="form-grid">'+field("Aufgabe","task-title","text","","required maxlength=\"100\" placeholder=\"z. B. Mathe lernen\"",true)+field("Datum","task-date","date",selectedDate,"required",true)+field("Dauer (Minuten)","task-duration","number","25","min=\"5\" max=\"600\" step=\"5\" required",false)+'<div class="field"><label for="task-priority">Priorität</label><select id="task-priority"><option>Hoch</option><option selected>Mittel</option><option>Niedrig</option></select></div></div><div class="form-actions"><button class="btn" type="button" data-action="modal-close">Abbrechen</button><button class="btn mint" type="submit">Aufgabe speichern</button></div></form>');
}
function openEventForm(){
modal('<h2>Neuer Termin</h2><p>Ein einmaliger Termin wird am ausgewählten Datum in deinem Kalender angezeigt.</p><form id="event-form"><div class="form-grid">'+field("Termin","event-title","text","","required maxlength=\"100\" placeholder=\"z. B. Zahnarzt\"",true)+field("Datum","event-date","date",selectedDate,"required",true)+field("Beginn","event-start","time","16:00","required",false)+field("Dauer (Minuten)","event-duration","number","60","min=\"5\" max=\"720\" step=\"5\" required",false)+'<div class="field full"><label for="event-category">Kategorie</label><select id="event-category"><option>Termin</option><option>Schule</option><option>Sport</option><option>Familie</option><option>Freizeit</option><option>Sonstiges</option></select></div><div class="field full"><label for="event-notes">Notiz (optional)</label><textarea id="event-notes" maxlength="240" placeholder="Ort oder weitere Infos"></textarea></div></div><div class="form-actions"><button class="btn" type="button" data-action="modal-close">Abbrechen</button><button class="btn mint" type="submit">Termin speichern</button></div></form>');
}
function openRoutineForm(){
modal('<h2>Wiederkehrende Aktivität</h2><p>Diese Aktivität wird jede Woche am gewählten Wochentag im Kalender angezeigt.</p><form id="routine-form"><div class="form-grid">'+field("Aktivität","routine-title","text","","required maxlength=\"70\" placeholder=\"z. B. Schwimmtraining\"",true)+'<div class="field"><label for="routine-day">Wochentag</label><select id="routine-day">'+DAY_NAMES.map((n,i)=>'<option value="'+i+'" '+(i===mondayIndex(parseDate(selectedDate))?"selected":"")+'>'+n+'</option>').join("")+'</select></div>'+field("Beginn","routine-start","time","17:00","required",false)+field("Dauer (Minuten)","routine-duration","number","60","min=\"10\" max=\"600\" step=\"5\" required",false)+'<div class="field full"><label for="routine-category">Kategorie</label><select id="routine-category"><option>Sport</option><option>Musik</option><option>Verein</option><option>Familie</option><option>Sonstiges</option></select></div></div><div class="form-actions"><button class="btn" type="button" data-action="modal-close">Abbrechen</button><button class="btn mint" type="submit">Routine speichern</button></div></form>');
}
function collectDayChecks(root){return Array.from(root.querySelectorAll(".day-check:checked")).map(el=>Number(el.value));}
function finishSetup(){data.school=draftSchool;data.routines=draftRoutines;data.setupDone=true;data.selectedDate=iso(today);save();currentView="today";renderApp();notify("Willkommen bei StudyPilot! ✨");}
document.addEventListener("click",function(e){
const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;
if(a==="setup-next"){if(setupStep===1){const days=collectDayChecks($("root"));const start=$("school-start").value,end=$("school-end").value;if(!days.length){notify("Wähle mindestens einen Schultag.");return;}if(!start||!end||timeM(end)<=timeM(start)){notify("Bitte prüfe Schulbeginn und Schulende.");return;}draftSchool={days:days,start:start,end:end};}setupStep=Math.min(3,setupStep+1);renderSetup();}
else if(a==="setup-back"){setupStep=Math.max(0,setupStep-1);renderSetup();}
else if(a==="setup-finish")finishSetup();
else if(a==="draft-delete"){draftRoutines=draftRoutines.filter(r=>r.id!==b.dataset.id);renderSetup();}
else if(a==="nav"){currentView=b.dataset.view;renderApp();}
else if(a==="new-menu")openNewMenu();
else if(a==="new-task"){closeModal();openTaskForm();}
else if(a==="new-event"){closeModal();openEventForm();}
else if(a==="new-routine"){closeModal();openRoutineForm();}
else if(a==="modal-close")closeModal();
else if(a==="modal-close-backdrop"&&e.target===b)closeModal();
else if(a==="task-toggle"){const t=data.tasks.find(t=>t.id===b.dataset.id);if(t)t.done=!t.done;save();renderApp();}
else if(a==="task-delete"){data.tasks=data.tasks.filter(t=>t.id!==b.dataset.id);save();renderApp();notify("Aufgabe gelöscht.");}
else if(a==="routine-delete"){data.routines=data.routines.filter(r=>r.id!==b.dataset.id);save();renderApp();notify("Aktivität entfernt.");}
else if(a==="select-date"){setDate(b.dataset.date);visibleMonth=new Date(parseDate(selectedDate).getFullYear(),parseDate(selectedDate).getMonth(),1);renderApp();}
else if(a==="month-prev"){visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()-1,1);renderApp();}
else if(a==="month-next"){visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()+1,1);renderApp();}
else if(a==="month-today"){visibleMonth=new Date(today.getFullYear(),today.getMonth(),1);setDate(iso(today));renderApp();}
else if(a==="edit-school"){currentView="settings";renderApp();}
else if(a==="export-data"){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download="studypilot-backup.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify("Backup wurde erstellt.");}
else if(a==="import-data"){$("import-file").click();}
else if(a==="restart-setup"){draftSchool=JSON.parse(JSON.stringify(data.school));draftRoutines=data.routines.slice();setupStep=0;data.setupDone=false;save();renderSetup();}
});
document.addEventListener("submit",function(e){
if(e.target.id==="setup-routine-form"){e.preventDefault();const title=$("draft-title").value.trim(),days=collectDayChecks(e.target),start=$("draft-start").value,duration=Number($("draft-duration").value);if(!title||!days.length||!start||!duration||duration<10||duration>600){notify("Bitte Titel, Tage, Startzeit und Dauer prüfen.");return;}days.forEach(day=>draftRoutines.push({id:uid(),title,day,start,duration,category:$("draft-category").value,emoji:$("draft-category").value==="Sport"?"⚽":$("draft-category").value==="Musik"?"🎵":"✦"}));renderSetup();notify("Aktivität hinzugefügt.");}
if(e.target.id==="task-form"){e.preventDefault();const title=$("task-title").value.trim(),date=$("task-date").value,duration=Number($("task-duration").value);if(!title||!date||duration<5||duration>600){notify("Bitte kontrolliere deine Angaben.");return;}data.tasks.push({id:uid(),title,date,duration,priority:$("task-priority").value,done:false});setDate(date);closeModal();save();renderApp();notify("Aufgabe gespeichert.");}
if(e.target.id==="event-form"){e.preventDefault();const title=$("event-title").value.trim(),date=$("event-date").value,start=$("event-start").value,duration=Number($("event-duration").value);if(!title||!date||!start||duration<5||duration>720){notify("Bitte kontrolliere deine Angaben.");return;}data.events.push({id:uid(),title,date,start,end:addM(start,duration),duration,category:$("event-category").value,notes:$("event-notes").value.trim()});setDate(date);visibleMonth=new Date(parseDate(date).getFullYear(),parseDate(date).getMonth(),1);closeModal();save();renderApp();notify("Termin gespeichert.");}
if(e.target.id==="routine-form"){e.preventDefault();const title=$("routine-title").value.trim(),day=Number($("routine-day").value),start=$("routine-start").value,duration=Number($("routine-duration").value),category=$("routine-category").value;if(!title||!start||duration<10||duration>600){notify("Bitte kontrolliere deine Angaben.");return;}data.routines.push({id:uid(),title,day,start,duration,category,emoji:category==="Sport"?"⚽":category==="Musik"?"🎵":"✦"});closeModal();save();renderApp();notify("Wöchentliche Aktivität gespeichert.");}
if(e.target.id==="school-edit-form"){e.preventDefault();const days=collectDayChecks(e.target),start=$("edit-school-start").value,end=$("edit-school-end").value;if(!days.length||!start||!end||timeM(end)<=timeM(start)){notify("Bitte prüfe Schultage und Uhrzeiten.");return;}data.school={days,start,end};save();renderApp();notify("Stundenplan aktualisiert.");}
});
document.addEventListener("change",function(e){if(e.target.id==="import-file"&&e.target.files&&e.target.files[0]){const f=e.target.files[0],reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported||!imported.school||!Array.isArray(imported.tasks)||!Array.isArray(imported.routines)||!Array.isArray(imported.events))throw new Error("bad");data=Object.assign(defaultData(),imported);save();renderApp();notify("Backup importiert.");}catch(err){notify("Diese Backup-Datei ist ungültig.");}};reader.readAsText(f);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
renderApp();
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
})();
</script>
</body>
</html>
