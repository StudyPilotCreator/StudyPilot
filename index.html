 if(a==="delete-set"){const target=getSet(b.dataset.id);if(!target)return;if(confirm("Lernset „"+target.title+"“ samt Themen, Karten und Quiz-Ergebnissen löschen?")){const cardIds=new Set(target.topics.flatMap(t=>t.cards.map(c=>c.id)));for(const id of cardIds)delete data.reviews[id];delete data.quizStats[target.id];data.sets=data.sets.filter(s=>s.id!==target.id);if(data.lastOpened===target.id)data.lastOpened=data.sets[0]?.id||"";setId="";subjectFilter=target.subject;view="library";save();renderApp();notify("Lernset gelöscht.");}return;}
 if(a==="remove-file"){pendingFiles.splice(Number(b.dataset.index),1);showFileList();return;}
 if(a==="modal-close"){closeModal();return;}
 if(a==="modal-backdrop"&&e.target===b){closeModal();return;}
 if(a==="export-data"){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="studypilot-lerndaten-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify("Backup exportiert.");return;}
 if(a==="import-data"){$("backup-file").click();return;}
 if(a==="reset-data"){if(confirm("Wirklich alle Lernsets, Karteikarten und Ergebnisse löschen? Exportiere vorher bei Bedarf ein Backup.")){data=baseData();setupStep=0;save();view="home";renderApp();notify("Lerndaten gelöscht.");}return;}
}
function closeModal(){$("modal-root").innerHTML="";pendingFiles=[];processing=false;}
function updateSearch(){const input=$("library-search");if(!input)return;const q=input.value.toLocaleLowerCase("de");document.querySelectorAll("#set-results .set-card").forEach(c=>{c.style.display=c.textContent.toLocaleLowerCase("de").includes(q)?"":"none";});}
document.addEventListener("input",e=>{if(e.target.id==="library-search")updateSearch();});
function refreshDifficultyLabel(prefix){const gradeEl=$(prefix+"-grade"),difficultyEl=$(prefix+"-difficulty");if(!gradeEl||!difficultyEl)return;const option=Array.from(difficultyEl.options).find(o=>o.value==="Automatisch");if(option)option.textContent=(prefix==="setup"?"Automatisch passend zur Klassenstufe (":"Automatisch: ")+gradeDifficulty(Number(gradeEl.value))+(prefix==="setup"?")":"");}
document.addEventListener("change",e=>{
 if(e.target.id==="setup-grade")refreshDifficultyLabel("setup");
 if(e.target.id==="profile-grade")refreshDifficultyLabel("profile");
 if(e.target.id==="set-files"){const selected=Array.from(e.target.files||[]),rejected=[];pendingFiles=[];let totalBytes=0;for(const file of selected){if(pendingFiles.length>=8){rejected.push(file.name+" (max. 8 Dateien)");continue;}if(file.size>20*1024*1024){rejected.push(file.name+" (über 20 MB)");continue;}if(totalBytes+file.size>60*1024*1024){rejected.push(file.name+" (Gesamtlimit 60 MB)");continue;}pendingFiles.push(file);totalBytes+=file.size;}showFileList();e.target.value="";if(rejected.length)notify("Übersprungen: "+rejected.length+" Datei(en). Max. 8 Dateien, 20 MB je Datei, 60 MB insgesamt.");}
 if(e.target.id==="set-topic-files"){const selected=Array.from(e.target.files||[]),rejected=[];pendingTopicFiles=[];for(const file of selected){if(pendingTopicFiles.length>=8){rejected.push(file.name+" (max. 8 Dateien)");continue;}if(file.size>20*1024*1024){rejected.push(file.name+" (über 20 MB)");continue;}pendingTopicFiles.push(file);}const el=$("topic-file-list");if(el)el.innerHTML=pendingTopicFiles.map(file=>'<div class="file-chip"><span>🗂️</span><span style="flex:1;overflow-wrap:anywhere">' +esc(file.name)+' · '+Math.max(1,Math.round(file.size/1024))+' KB</span></div>').join("");e.target.value="";if(rejected.length)notify("Einige Themen-Dateien wurden übersprungen (max. 8 Dateien, 20 MB je Datei).");}
 if(e.target.id==="backup-file"&&e.target.files&&e.target.files[0]){const f=e.target.files[0];if(f.size>15*1024*1024){notify("Backup ist zu groß. Maximale Dateigröße: 15 MB.");e.target.value="";return;}const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||typeof obj!=="object"||!obj.profile||typeof obj.profile!=="object"||!Array.isArray(obj.sets))throw new Error("Ungültige Backup-Struktur");if(!confirm("Das Backup ersetzt deine Lerndaten. Fortfahren?")){e.target.value="";return;}data=normalizeData(obj);const ok=save();view="home";subjectFilter="";setId="";session=null;renderApp();notify(ok?"Backup importiert.":"Backup geladen, aber der Browser-Speicher ist voll.");}catch(err){notify("Backup ungültig oder beschädigt.");}e.target.value="";};r.readAsText(f);}
});
document.addEventListener("click",handleClick);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if((e.key==="Enter"||e.key===" ")&&e.target.matches(".flashcard")){e.preventDefault();session.flipped=!session.flipped;renderApp();}});
document.addEventListener("submit",async e=>{
 if(e.target.id==="setup-form"){e.preventDefault();syncSetupFields();if(setupStep<2){if(setupStep===1&&!data.profile.subjects.length){notify("Wähle mindestens ein Fach.");return;}setupStep++;setup();return;}data.profile.setupDone=true;if(!data.profile.subjects.length)data.profile.subjects=["Deutsch","Mathematik","Englisch"];save();setupStep=0;view="home";renderApp();notify("Lernprofil eingerichtet.");return;}
 if(e.target.id==="profile-form"){e.preventDefault();data.profile.school=$("profile-school").value;data.profile.grade=Number($("profile-grade").value);data.profile.difficulty=$("profile-difficulty").value;save();renderApp();notify("Lernprofil gespeichert.");return;}
 if(e.target.id==="new-set-form"){
  e.preventDefault();if(processing)return;
  const title=$("set-title").value.trim(),subject=$("set-subject").value,exam=$("set-exam").value;let topicInput=$("set-topics").value.trim(),txt=$("set-notes").value.trim();const files=pendingFiles.slice(),topicFiles=pendingTopicFiles.slice();
  if(!title){notify("Gib dem Lernset einen Namen.");return;}if(!txt&&!files.length&&!topicInput&&!topicFiles.length){notify("Füge eine Themenliste oder Lerninhalte ein.");return;}
  processing=true;const btn=$("create-button"),loader=$("create-loading"),progressTrack=loader&&loader.querySelector(".create-progress-track"),fill=$("create-progress-fill"),label=$("create-progress-label"),percent=$("create-progress-percent"),originalButton=btn.textContent;let progressValue=0;btn.disabled=true;btn.setAttribute("aria-busy","true");btn.textContent="⏳ Wird erstellt …";if(loader){loader.classList.remove("error");loader.classList.add("active");loader.setAttribute("aria-hidden","false");}const updateProgress=value=>{progressValue=Math.max(progressValue,Math.min(100,Math.round(value)));if(fill)fill.style.width=progressValue+"%";if(percent)percent.textContent=progressValue+"%";if(progressTrack)progressTrack.setAttribute("aria-valuenow",String(progressValue));};const status=m=>{const message=String(m||"");const n=$("create-status");if(n)n.textContent=message;if(label)label.textContent=message;let value=14;const fm=message.match(/Datei\s+(\d+)\s+von\s+(\d+)/i),pm=message.match(/PDF lesen:\s*Seite\s+(\d+)\s+von\s+(\d+)/i);if(/Lernmaterial wird vorbereitet/i.test(message))value=6;else if(fm)value=12+(Number(fm[1])-1)/Math.max(1,Number(fm[2]))*62;else if(pm)value=25+Number(pm[1])/Math.max(1,Number(pm[2]))*45;else if(/Foto erkennen/i.test(message))value=48;else if(/Erstelle Übersicht/i.test(message))value=86;updateProgress(value);};status("Lernmaterial wird vorbereitet …");
  try{let docs=[],errors=[];if(topicFiles.length){status("Themenliste wird eingelesen …");const tr=await readFiles(topicFiles,status,true);if(tr.text.trim().length>=2){topicInput=(topicInput+"\n"+tr.text).trim();}else if(!parseTopicList(topicInput).length){throw new Error(tr.errors[0]||"Themenliste nicht erkannt. Bitte tippe die Themen unten ein oder lade ein klareres Foto/PDF hoch.");}if(tr.errors.length)errors.push("Themenliste: "+tr.errors.join("; "));}if(files.length){const r=await readFiles(files,status);txt=(txt+"\n\n"+r.text).trim();docs=r.names;errors=errors.concat(r.errors);}const parsedTopics=parseTopicList(topicInput);if(topicInput&&!parsedTopics.length)throw new Error("Die Themenliste wurde nicht erkannt. Schreibe jedes Thema in eine eigene Zeile, zum Beispiel: Ständegesellschaft, Ritter und Burgen, Klosterleben.");if(txt.length<25&&!parsedTopics.length)throw new Error("Es wurden keine Lerninhalte oder erkennbaren Themen gefunden. Füge Text, ein PDF oder ein Foto ein.");status(txt.length<25?"Themen erkannt. Erstelle deine Themenübersicht …":"Erstelle Übersicht, Karteikarten und Quizfragen …");const s=makeSet({title,subject,exam,topicInput,text:txt,documents:docs,grade:data.profile.grade,difficulty:data.profile.difficulty});data.sets.unshift(s);data.lastOpened=s.id;const ok=save();closeModal();setId=s.id;view="set";renderApp();notify("Lernset erstellt: "+s.topics.length+" Themen, "+s.topics.reduce((n,t)=>n+t.cards.length,0)+" Karten und "+s.topics.reduce((n,t)=>n+t.questions.length,0)+" Fragen."+(ok?"":" Speicher prüfen."));if(errors.length)alert("Einige Dateien konnten nicht gelesen werden:\n"+errors.join("\n")+"\n\nDu kannst den Text über „Material bearbeiten“ ergänzen.");}
  catch(err){status(err.message||"Ein Fehler ist aufgetreten.");if(loader)loader.classList.add("error");updateProgress(100);btn.disabled=false;btn.removeAttribute("aria-busy");btn.textContent=originalButton;notify("Lernset konnte nicht erstellt werden.");}
  finally{processing=false;}return;
 }
 if(e.target.id==="edit-form"){
  e.preventDefault();
  const old=getSet($("edit-id").value),title=$("edit-title").value.trim(),files=Array.from($("edit-files").files||[]);
  let txt=$("edit-content").value.trim();
  if(!old||!title||(!txt&&!files.length)){notify("Bitte gib einen Titel und Text oder neue Dateien ein.");return;}
  const btn=$("edit-submit"),status=$("edit-status"),original=btn.textContent;
  btn.disabled=true;btn.textContent="⏳ Wird verarbeitet …";
  const updateStatus=m=>{if(status)status.textContent=m;};
  let fileErrors=[];
  try{
   let docs=old.documents||[];
   if(files.length){
    const result=await readFiles(files,updateStatus);
    fileErrors=result.errors;
    txt=(txt+"\n\n"+result.text).trim();
    docs=unique(docs.concat(result.names));
   }
   if(txt.length<25)throw new Error(fileErrors[0]||"Es wurde zu wenig Lernstoff erkannt. Bitte lade ein weiteres PDF/Foto hoch oder füge mehr Text ein.");
   const oldCardIds=new Set(old.topics.flatMap(t=>t.cards.map(c=>c.id)));
   const s=makeSet({title,subject:old.subject,exam:old.exam,topicInput:(old.topicNames||[]).join("\n"),text:txt,documents:docs,grade:old.grade||data.profile.grade,difficulty:old.difficulty||data.profile.difficulty});
   s.id=old.id;s.createdAt=old.createdAt;
   for(const cardId of oldCardIds)delete data.reviews[cardId];
   delete data.quizStats[old.id];data.sets=data.sets.map(x=>x.id===old.id?s:x);save();closeModal();setId=s.id;view="set";renderApp();
   notify("Lernmaterial aktualisiert: "+s.topics.length+" Themen, "+s.topics.reduce((n,t)=>n+t.cards.length,0)+" Karten und "+s.topics.reduce((n,t)=>n+t.questions.length,0)+" Fragen.");
   if(fileErrors.length)alert("Einige Dateien konnten nicht gelesen werden:\n"+fileErrors.join("\n"));
  }catch(err){updateStatus(err.message||"Ein Fehler ist aufgetreten.");btn.disabled=false;btn.textContent=original;}
  return;
 }
});
if("serviceWorker" in navigator&&location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
renderApp();
</script>
