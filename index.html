.quiz-card{padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#1d2037,#15182b)}.quiz-question{font-size:clamp(17px,3vw,23px);font-weight:850;line-height:1.5;margin:13px 0 20px;white-space:pre-line}.quiz-options{display:grid;gap:9px}.quiz-option{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:13px;background:#ffffff04;color:var(--ink);font-size:12px;line-height:1.5}.quiz-option.correct{border-color:#70d9bcaa;background:#1c554750}.quiz-option.wrong{border-color:#ff9db288;background:#5c28394d}.option-letter{width:27px;height:27px;display:grid;place-items:center;flex-shrink:0;border-radius:9px;background:#ffffff0b;color:var(--purple);font-size:11px;font-weight:900}.feedback{margin-top:13px;padding:12px;border-radius:12px;font-size:12px;line-height:1.65;background:#ffffff07}.feedback.good{border:1px solid #82ead055;color:#a7f2dd}.feedback.bad{border:1px solid #ff9db255;color:#ffc0cc}.session-progress{height:5px;border-radius:99px;background:#ffffff12;overflow:hidden;margin:12px 0 22px}.session-progress>div{height:100%;background:linear-gradient(90deg,var(--purple),var(--mint))}
.file-list{display:grid;gap:7px;margin-top:9px}.file-chip{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#ffffff04;font-size:10px;color:var(--muted)}.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;border:1px dashed #a69aff65;border-radius:16px;background:#a69aff08;text-align:center;cursor:pointer}.dropzone strong{font-size:12px}.dropzone span{font-size:10px;color:var(--muted);line-height:1.6}
.form-note{padding:12px;border:1px solid #82ead033;border-radius:13px;background:#82ead008;color:#b9f3e4;font-size:10px;line-height:1.75}.back-link{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;color:#c5bcff;font-size:11px;font-weight:850;margin-bottom:16px}.due-tag{font-size:10px;font-weight:800;color:var(--yellow)}
@media(max-width:760px){.subject-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.set-list,.topic-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.mode-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app{padding-bottom:105px}}
@media(max-width:420px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:1}.mode-grid{grid-template-columns:1fr}.mode-card{flex-direction:row;align-items:center}.mode-copy{display:none}.flashcard{min-height:235px;padding:22px}.modal{padding:17px}}

<body>
<div id="root"></div><div id="modal-root"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const KEY="studypilot.learn.v1";
const SUBJECTS=[["Deutsch","📖","#40345f"],["Mathematik","➗","#203e5b"],["Englisch","🇬🇧","#473550"],["Geschichte","🏛️","#55402e"],["Biologie","🌿","#24463d"],["Chemie","⚗️","#293e5a"],["Physik","⚡","#4a3c27"],["Geographie","🌍","#244b4a"],["Politik","🏛️","#3c395b"],["Wirtschaft","📈","#244a42"],["Informatik","💻","#253e56"],["Französisch","🇫🇷","#493652"],["Latein","📜","#51402d"],["Religion/Ethik","🕊️","#3b3c59"],["Kunst","🎨","#4c354b"],["Musik","🎵","#46325b"],["Sport","⚽","#24443b"],["Spanisch","🇪🇸","#543d2c"]].map(x=>({name:x[0],icon:x[1],color:x[2]}));
const EXAMS=["Klassenarbeit","Test","Referat","Präsentation","Mündliche Prüfung","Allgemeines Lernen"];
const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseDate=s=>{const p=String(s||iso(new Date())).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=new Date();today.setHours(0,0,0,0);const todayKey=iso(today);
const subInfo=n=>SUBJECTS.find(s=>s.name===n)||{name:n,icon:"📘",color:"#36314f"};
const baseData=()=>({profile:{setupDone:false,school:"Gymnasium",grade:8,difficulty:"Automatisch",subjects:["Deutsch","Mathematik","Englisch","Geschichte","Biologie"]},sets:[],reviews:{},quizStats:{},lastOpened:""});
let data;try{data=JSON.parse(localStorage.getItem(KEY)||"null")||baseData();if(!data.profile)data.profile=baseData().profile;if(!Array.isArray(data.sets))data.sets=[];if(!data.reviews)data.reviews={};if(!data.quizStats)data.quizStats={};if(!Array.isArray(data.profile.subjects))data.profile.subjects=baseData().profile.subjects;data.sets=data.sets.map(s=>({...s,topics:Array.isArray(s.topics)?s.topics:[],documents:Array.isArray(s.documents)?s.documents:[]}));}catch(e){data=baseData();}
let view="home",subjectFilter="",setId="",topicId="",session=null,returnView="home",pendingFiles=[],processing=false,toastTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){notify("Speicher voll. Exportiere ein Backup oder entferne ein Lernset.");return false;}}
function notify(t){const e=$("toast");if(!e)return;e.textContent=t;e.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove("show"),3000);}
function gradeDifficulty(g){return g<=4?"Einfach":g<=7?"Einfach bis mittel":g<=9?"Mittel":g<=10?"Mittel bis anspruchsvoll":"Anspruchsvoll";}
function gradeOptions(g){return Array.from({length:13},(_,i)=>i+1).map(n=>'<option value="'+n+'" '+(Number(g)===n?"selected":"")+'>'+n+'. Klasse</option>').join("");}
function chipsHtml(selected){return '<div class="chips">'+SUBJECTS.map(s=>'<button type="button" class="chip '+(selected.includes(s.name)?"selected":"")+'" data-action="toggle-subject" data-subject="'+esc(s.name)+'">'+s.icon+' '+esc(s.name)+'</button>').join("")+'</div>';}
function getSubjectOptions(selected){const list=data.profile.subjects.length?data.profile.subjects:SUBJECTS.map(s=>s.name);return list.map(s=>'<option '+(s===selected?"selected":"")+'>'+esc(s)+'</option>').join("");}
function setup(){
 const p=data.profile;
 $("root").innerHTML='<main class="app"><header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">StudyPilot</div><div class="brand-sub">Dein persönlicher Lerncoach</div></div></div><span class="badge">Einrichtung</span></header><div class="setup-wrap"><section class="setup-card"><div class="eyebrow">LERNEN, DAS ZU DIR PASST</div><div class="setup-logo" style="margin-top:14px">✦</div><h1 style="font-size:40px;line-height:1.05;margin:16px 0">Weniger suchen.<br>Mehr verstehen.</h1><p class="page-intro">Aus deinen Themenlisten, Heftfotos und PDFs werden kurze Übersichten, Karteikarten und Quizze. Richte deine Lernstufe einmal ein und erstelle danach für jede Klassenarbeit ein eigenes Lernset.</p><form id="setup-form"><div class="form-grid"><div class="field"><label for="setup-school">Welche Schulform besuchst du?</label><select id="setup-school">'+["Grundschule","Gymnasium","Realschule","Gesamtschule","Berufsschule","Andere"].map(s=>'<option '+(s===p.school?"selected":"")+'>'+s+'</option>').join("")+'</select></div><div class="field"><label for="setup-grade">In welcher Klasse bist du?</label><select id="setup-grade">'+gradeOptions(p.grade)+'</select></div><div class="field full"><label for="setup-difficulty">Lernschwierigkeit</label><select id="setup-difficulty"><option value="Automatisch" '+(p.difficulty==="Automatisch"?"selected":"")+'>Automatisch passend zur Klassenstufe ('+gradeDifficulty(p.grade)+')</option><option '+(p.difficulty==="Einfach"?"selected":"")+' value="Einfach">Einfach erklären</option><option '+(p.difficulty==="Mittel"?"selected":"")+' value="Mittel">Normal</option><option '+(p.difficulty==="Anspruchsvoll"?"selected":"")+' value="Anspruchsvoll">Anspruchsvoll</option></select></div><div class="field full"><label>Welche Fächer brauchst du?</label>'+chipsHtml(p.subjects||[])+'</div></div><div class="form-note" style="margin-top:15px">🔒 Erkannter Text, Lernsets, Karteikarten und Quiz-Ergebnisse werden auf diesem Gerät gespeichert. Fotos und PDFs werden im Browser verarbeitet und nicht an einen StudyPilot-Server hochgeladen.</div><div class="form-actions"><button class="btn primary" type="submit">Meine Lern-App einrichten →</button></div></form></section></div></main>';
}
function navButton(id,icon,label){return '<button class="nav-item '+(view===id||((id==="library")&&(view==="set"||view==="topic"))?"active":"")+'" data-action="nav" data-view="'+id+'"><span class="nav-icon">'+icon+'</span><span>'+label+'</span></button>';}
function allCards(){return data.sets.flatMap(s=>s.topics.flatMap(t=>t.cards.map(c=>({...c,setId:s.id,setTitle:s.title,subject:s.subject,topicTitle:t.title}))));}
function dueCards(){return allCards().filter(c=>!data.reviews[c.id]||!data.reviews[c.id].dueAt||data.reviews[c.id].dueAt<=todayKey);}
function quizCount(){return Object.values(data.quizStats).reduce((n,s)=>n+(s.played||0),0);}
function setCard(s){const inf=subInfo(s.subject),cards=s.topics.reduce((n,t)=>n+t.cards.length,0);return '<button class="set-card" data-action="open-set" data-id="'+esc(s.id)+'"><span class="set-icon" style="--subbg:'+inf.color+'">'+inf.icon+'</span><span style="flex:1;min-width:0"><span class="set-title">'+esc(s.title)+'</span><span class="set-meta">'+esc(s.subject)+' · '+esc(s.exam)+'<br>'+s.topics.length+' Themen · '+cards+' Karteikarten</span></span></button>';}
function renderHome(){
 const due=dueCards(),recent=data.sets.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,4),last=data.sets.find(s=>s.id===data.lastOpened)||recent[0];
 return '<section class="view"><section class="hero glass"><div class="eyebrow">DEIN LERNCOACH · '+esc(data.profile.grade)+'. KLASSE</div><h1>Hallo! 👋<br>Was lernst du heute?</h1><p>Dein Stoff, verständlich sortiert. Erstelle aus Fotos, PDFs oder Notizen ein Lernset mit Zusammenfassung, Karteikarten und Quiz — und wiederhole gezielt, was du noch üben musst.</p><div class="hero-actions"><button class="btn primary" data-action="new-set">＋ Neues Lernset erstellen</button>'+(last?'<button class="btn" data-action="open-set" data-id="'+esc(last.id)+'">Weiterlernen ↗</button>':'')+'</div></section><div class="stats"><div class="stat"><div class="stat-icon">📚</div><div class="stat-number">'+data.sets.length+'</div><div class="stat-label">Lernsets</div></div><div class="stat"><div class="stat-icon">🔁</div><div class="stat-number">'+due.length+'</div><div class="stat-label">Karten fällig</div></div><div class="stat"><div class="stat-icon">🎯</div><div class="stat-number">'+quizCount()+'</div><div class="stat-label">Quiz-Runden</div></div></div><div class="grid"><section class="panel glass"><div class="panel-head"><h2>Heute wiederholen</h2><span class="badge">'+due.length+' fällig</span></div>'+(due.length?'<div class="simple-list">'+due.slice(0,3).map(c=>'<div class="simple-row"><div class="simple-row-icon">🗂️</div><div class="simple-row-main"><div class="simple-row-title">'+esc(c.question)+'</div><div class="simple-row-meta">'+esc(c.subject)+' · '+esc(c.topicTitle)+'</div></div></div>').join("")+'</div><div class="hero-actions" style="margin-top:13px"><button class="btn mint" data-action="start-review">Wiederholung starten →</button></div>':'<div class="empty">Du bist auf dem Laufenden.<br>Erstelle ein Lernset, um neue Karteikarten aufzubauen.</div>')+'</section><section class="panel glass"><div class="panel-head"><h2>Deine Fächer</h2><button class="btn small" data-action="nav" data-view="library">Alle →</button></div><div class="chips">'+data.profile.subjects.slice(0,9).map(n=>'<button class="chip" data-action="open-subject" data-subject="'+esc(n)+'">'+subInfo(n).icon+' '+esc(n)+'</button>').join("")+'</div><div class="form-note" style="margin-top:13px">Lernsets, Karten und Quiz-Ergebnisse bleiben auf diesem Gerät gespeichert.</div></section></div><div class="section-row"><h2>Zuletzt erstellt</h2><button class="btn small" data-action="nav" data-view="library">Alle Lernsets →</button></div>'+(recent.length?'<div class="set-list">'+recent.map(setCard).join("")+'</div>':'<div class="empty"><div class="empty-icon">📂</div>Dein Lernordner ist noch leer.<br>Erstelle dein erstes Set, z. B. „Geschichte – Zweiter Weltkrieg“.</div>')+'</section>';
}
function renderLibrary(){
 if(subjectFilter){const sets=data.sets.filter(s=>s.subject===subjectFilter),i=subInfo(subjectFilter);return '<section class="view"><button class="back-link" data-action="subject-back">← Alle Fächer</button><div class="panel-head"><div><h1 class="section-title">'+i.icon+' '+esc(subjectFilter)+'</h1><div class="small-text">'+sets.length+' Lernsets</div></div><button class="btn primary" data-action="new-set" data-subject="'+esc(subjectFilter)+'">＋ Lernset</button></div><input id="library-search" class="search" placeholder="Lernsets durchsuchen …" value="'+esc(searchQuery)+'"><div class="section-row"><h2>Deine Lernsets</h2></div><div id="set-results" class="set-list">'+(sets.length?sets.map(setCard).join(""):'<div class="empty" style="grid-column:1/-1">Noch keine Lernsets in diesem Fach.</div>')+'</div></section>';}
 const cards=data.profile.subjects.map(n=>{const i=subInfo(n),sets=data.sets.filter(s=>s.subject===n);return '<button class="subject-card" style="--subbg:'+i.color+'" data-action="open-subject" data-subject="'+esc(n)+'"><span class="subject-icon" style="--subbg:'+i.color+'">'+i.icon+'</span><span><span class="subject-name">'+esc(n)+'</span><span class="subject-count">'+sets.length+' Lernsets</span></span></button>';}).join("");
 const all=data.sets.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
 return '<section class="view"><div class="panel-head"><div><h1 class="section-title">Deine Fächer</h1><p class="page-intro" style="margin-bottom:0">Dein persönlicher Lernordner. Alles, was du erstellst, bleibt hier gespeichert.</p></div><button class="btn primary" data-action="new-set">＋ Neues Set</button></div><div class="subject-grid">'+cards+'</div><div class="section-row"><h2>Alle Lernsets</h2><span class="badge">'+all.length+' gespeichert</span></div><input id="library-search" class="search" placeholder="Nach Thema, Fach oder Klassenarbeit suchen …" value="'+esc(searchQuery)+'"><div id="set-results" class="set-list">'+(all.length?all.map(setCard).join(""):'<div class="empty" style="grid-column:1/-1">Noch keine Lernsets vorhanden. Klicke auf „Neues Set“ und lade deine Themenliste hoch.</div>')+'</div></section>';
}
function getSet(id){return data.sets.find(s=>String(s.id)===String(id));}
function getTopic(s,id){return s&&s.topics.find(t=>String(t.id)===String(id));}
function renderSet(){
 const s=getSet(setId);if(!s){view="library";return renderLibrary();}
 const cards=s.topics.reduce((n,t)=>n+t.cards.length,0),questions=s.topics.reduce((n,t)=>n+t.questions.length,0),stats=data.quizStats[s.id]||{played:0};
 return '<section class="view"><button class="back-link" data-action="set-back">← '+esc(s.subject)+'</button><section class="hero glass"><div class="eyebrow">'+esc(s.subject)+' · '+esc(s.exam)+'</div><h1>'+esc(s.title)+'</h1><p>Deine Inhalte sind in Themen sortiert. Lies den Überblick, übe Karteikarten und teste dein Wissen im Themen- oder Komplettquiz.</p><div class="hero-actions"><button class="btn primary" data-action="start-quiz" data-set-id="'+esc(s.id)+'">🎯 Komplettquiz starten</button><button class="btn" data-action="start-cards" data-set-id="'+esc(s.id)+'">🗂️ Alle Karteikarten</button><button class="btn" data-action="edit-material" data-id="'+esc(s.id)+'">Material bearbeiten</button></div></section><div class="stats"><div class="stat"><div class="stat-icon">🧩</div><div class="stat-number">'+s.topics.length+'</div><div class="stat-label">Themen</div></div><div class="stat"><div class="stat-icon">🗂️</div><div class="stat-number">'+cards+'</div><div class="stat-label">Karteikarten</div></div><div class="stat"><div class="stat-icon">🎯</div><div class="stat-number">'+stats.played+'</div><div class="stat-label">Quiz-Runden</div></div></div><div class="section-row"><h2>Themenübersicht</h2><span class="small-text">'+questions+' Quizfragen insgesamt</span></div><div class="topic-grid">'+s.topics.map(t=>'<article class="topic-card"><div class="topic-title">'+esc(t.title)+'</div><div class="topic-snippet">'+esc(t.summary.slice(0,2).join(" "))+'</div><div class="topic-actions"><button class="btn small" data-action="open-topic" data-topic-id="'+esc(t.id)+'">Überblick →</button><button class="btn small" data-action="topic-quiz" data-topic-id="'+esc(t.id)+'">Quiz</button></div></article>').join("")+'</div><section class="panel glass" style="margin-top:15px"><div class="panel-head"><h2>Materialien</h2><span class="badge">'+s.documents.length+' Dateien</span></div><div class="simple-list">'+(s.documents.map(d=>'<div class="simple-row"><div class="simple-row-icon">'+(d.toLowerCase().endsWith(".pdf")?"📄":d.match(/\.txt$/i)?"📝":"🖼️")+'</div><div class="simple-row-main"><div class="simple-row-title">'+esc(d)+'</div><div class="simple-row-meta">Ausgelesen und verarbeitet</div></div></div>').join("")||'<div class="small-text">Aus eingefügtem Text erstellt.</div>')+'</div><div class="form-note" style="margin-top:14px">Gespeichert werden der erkannte Text und deine Lernmaterialien, nicht die Originaldatei. Du kannst den Text jederzeit bearbeiten und neu aufbereiten.</div></section></section>';
}
function renderTopic(){
 const s=getSet(setId),t=getTopic(s,topicId);if(!s||!t){view="set";return renderSet();}
 return '<section class="view"><button class="back-link" data-action="topic-back">← '+esc(s.title)+'</button><section class="hero glass"><div class="eyebrow">'+esc(s.subject)+' · THEMA</div><h1>'+esc(t.title)+'</h1><p>Das Wichtigste in kurzen Punkten. Wenn du den Überblick verstanden hast, teste dich mit Karteikarten oder einem Quiz.</p><div class="hero-actions"><button class="btn primary" data-action="topic-quiz" data-topic-id="'+esc(t.id)+'">🎯 Thema abfragen</button><button class="btn" data-action="topic-cards" data-topic-id="'+esc(t.id)+'">🗂️ Karteikarten</button></div></section><section class="panel glass" style="margin-top:15px"><div class="panel-head"><h2>Kurzer Überblick</h2><span class="badge">'+t.summary.length+' Stichpunkte</span></div><ul class="bullets">'+t.summary.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></section><section class="panel glass" style="margin-top:14px"><div class="panel-head"><h2>Merke dir diese Fakten</h2></div><div class="simple-list">'+t.cards.slice(0,6).map(c=>'<div class="simple-row"><div class="simple-row-icon">💡</div><div class="simple-row-main"><div class="simple-row-title">'+esc(c.question)+'</div><div class="simple-row-meta">'+esc(c.answer)+'</div></div></div>').join("")+'</div></section><p class="small-text" style="margin-top:13px">Automatisch aus deinen Materialien erstellt. Prüfe wichtige Daten und Definitionen mit deinen Unterrichtsunterlagen.</p></section>';
}
function renderReview(){
 const due=dueCards(),cards=allCards(),done=cards.filter(c=>data.reviews[c.id]&&data.reviews[c.id].lastAt).length;
 return '<section class="view"><h1 class="section-title">Wiederholen</h1><p class="page-intro">StudyPilot merkt sich lokal, welche Karteikarten du bereits geübt hast, und schlägt fällige Karten erneut vor.</p><section class="hero glass"><div class="eyebrow">DEIN GEDÄCHTNISTRAINING</div><h1 style="font-size:34px">Wissen behalten.<br>Nicht nur durchlesen.</h1><p>Versuche die Antwort selbst, drehe die Karte um und bewerte, wie sicher du warst. Unsichere Karten kommen morgen wieder.</p><button class="btn mint" data-action="start-review" '+(!due.length?"disabled":"")+'>'+(due.length?"Jetzt "+due.length+" Karten wiederholen":"Alles für heute geschafft ✓")+'</button></section><div class="stats"><div class="stat"><div class="stat-icon">🗂️</div><div class="stat-number">'+cards.length+'</div><div class="stat-label">Karten gesamt</div></div><div class="stat"><div class="stat-icon">🔁</div><div class="stat-number">'+due.length+'</div><div class="stat-label">Heute fällig</div></div><div class="stat"><div class="stat-icon">✅</div><div class="stat-number">'+done+'</div><div class="stat-label">Schon geübt</div></div></div><section class="panel glass"><div class="panel-head"><h2>Als Nächstes dran</h2><span class="small-text">'+cards.length+' Karten insgesamt</span></div>'+(due.length?'<div class="simple-list">'+due.slice(0,8).map(c=>'<div class="simple-row"><div class="simple-row-icon">🗂️</div><div class="simple-row-main"><div class="simple-row-title">'+esc(c.question)+'</div><div class="simple-row-meta">'+esc(c.subject)+' · '+esc(c.setTitle)+'</div></div></div>').join("")+'</div>':'<div class="empty">Keine Karten fällig. Erstelle ein Lernset oder übe vorhandene Karten.</div>')+'</section></section>';

  if(currentLine.trim())lines.push(currentLine.trim());
  let txt=lines.join("\n").trim();
  if(txt.replace(/\s+/g," ").length<35){
   try{const w=await getWorker(),v=page.getViewport({scale:1.5}),canvas=document.createElement("canvas");canvas.width=Math.round(v.width);canvas.height=Math.round(v.height);await page.render({canvasContext:canvas.getContext("2d"),viewport:v}).promise;txt=(await w.recognize(canvas)).data.text.trim();canvas.width=1;canvas.height=1;}catch(e){}
  }
  if(txt)parts.push("Seite "+n+":\n"+txt);
 }
 if(pdf.numPages>limit)parts.push("[Nur die ersten "+limit+" von "+pdf.numPages+" Seiten wurden ausgelesen.]");
 return parts.join("\n");
}
async function readFile(file,getWorker,status){const n=file.name.toLowerCase();if(n.endsWith(".txt")||file.type==="text/plain")return file.text();if(n.endsWith(".pdf")||file.type==="application/pdf")return pdfText(file,getWorker,status);if(file.type.startsWith("image/")||/\.(jpg|jpeg|png|webp|heic)$/i.test(n)){const w=await getWorker();status("Foto erkennen: "+file.name);return (await w.recognize(file)).data.text||"";}throw new Error("Dateiformat nicht unterstützt: "+file.name);}
async function readFiles(files,status){let w=null;const getWorker=async()=>{if(!w)w=await createWorker();return w;},parts=[],names=[],errors=[];try{for(let i=0;i<files.length;i++){status("Datei "+(i+1)+" von "+files.length+": "+files[i].name);try{const txt=await readFile(files[i],getWorker,status);if(txt.trim().length>3)parts.push("\n\n--- "+files[i].name+" ---\n"+txt);else errors.push(files[i].name+": kein lesbarer Text erkannt");names.push(files[i].name);}catch(e){errors.push(files[i].name+": "+e.message);}}}finally{if(w)try{await w.terminate();}catch(e){}}return {text:parts.join("\n").slice(0,120000),names,errors};}
function showFileList(){const el=$("file-list");if(el)el.innerHTML=pendingFiles.map((f,i)=>'<div class="file-chip"><span>'+(f.name.toLowerCase().endsWith(".pdf")?"📄":f.type.startsWith("image/")?"🖼️":"📝")+'</span><span style="flex:1;overflow-wrap:anywhere">'+esc(f.name)+' · '+Math.max(1,Math.round(f.size/1024))+' KB</span><button class="btn small" type="button" data-action="remove-file" data-index="'+i+'">Entfernen</button></div>').join("");}
function openEditMaterial(id){const s=getSet(id);if(!s)return;modal('<h2>Material bearbeiten</h2><p>Korrigiere den erkannten Text und lass Überblick, Karteikarten und Quiz neu erstellen.</p><form id="edit-form"><input type="hidden" id="edit-id" value="'+esc(s.id)+'"><div class="field"><label for="edit-title">Lernset-Titel</label><input id="edit-title" value="'+esc(s.title)+'" required></div><div class="field" style="margin-top:12px"><label for="edit-content">Erkannter Text</label><textarea id="edit-content" style="min-height:270px" required>'+esc(s.content||"")+'</textarea></div><div class="form-actions"><button class="btn" type="button" data-action="modal-close">Abbrechen</button><button class="btn mint" type="submit">Neu erstellen</button></div></form>');}
function startCards(id,tid,items){const s=id?getSet(id):null,prev=view==="session"?returnView:view;if(!items)items=tid?(getTopic(s,tid)||{}).cards||[]:s?s.topics.flatMap(t=>t.cards.map(c=>({...c,setId:s.id,setTitle:s.title,subject:s.subject,topicTitle:t.title}))):dueCards();if(!items.length){notify("Noch keine Karteikarten vorhanden.");return;}session={kind:"cards",setId:id||null,topicId:tid||null,items:items.map(c=>({...c,setId:c.setId||id,setTitle:c.setTitle||(s&&s.title)||"Wiederholen",subject:c.subject||(s&&s.subject)||"",topicTitle:c.topicTitle||(tid&&s&&getTopic(s,tid)?getTopic(s,tid).title:"")})),index:0,flipped:false};returnView=prev;view="session";renderApp();}
function startQuiz(id,tid){const s=getSet(id);if(!s){notify("Lernset nicht gefunden.");return;}const prev=view==="session"?returnView:view;let qs=tid?(getTopic(s,tid)||{}).questions||[]:s.topics.flatMap(t=>t.questions.map(q=>({...q,topicTitle:t.title})));qs=qs.slice(0,30);if(!qs.length){notify("Für dieses Thema wurden keine Fragen erstellt.");return;}session={kind:"quiz",setId:s.id,topicId:tid||null,topicTitle:tid?(getTopic(s,tid)||{}).title:"Komplettquiz",items:qs,index:0,answered:false,selectedIndex:-1,responses:[],saved:false};returnView=prev;data.lastOpened=s.id;save();view="session";renderApp();}
function addDays(key,n){const d=parseDate(key);d.setDate(d.getDate()+n);return iso(d);}
function rateCard(rating){const c=session.items[session.index];if(!c)return;const old=data.reviews[c.id]||{level:0},level=rating==="known"?Math.min(4,old.level+1):0;data.reviews[c.id]={level,dueAt:addDays(todayKey,rating==="known"?[1,3,7,14,30][Math.max(0,level-1)]:1),lastAt:new Date().toISOString(),rating};session.index++;session.flipped=false;save();renderApp();}
function endSession(){session=null;view=returnView==="session"?"home":returnView;renderApp();}
function handleClick(e){
 const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;
 if(a==="toggle-subject"){if(view==="profile"){data.profile.school=$("profile-school").value;data.profile.grade=Number($("profile-grade").value);data.profile.difficulty=$("profile-difficulty").value;}else if($("setup-school")){data.profile.school=$("setup-school").value;data.profile.grade=Number($("setup-grade").value);data.profile.difficulty=$("setup-difficulty").value;}const arr=data.profile.subjects,n=b.dataset.subject,i=arr.indexOf(n);if(i>=0){if(arr.length===1){notify("Wähle mindestens ein Fach.");return;}arr.splice(i,1);}else arr.push(n);if(view==="profile")renderApp();else setup();return;}
 if(a==="new-set"){openNewSet(b.dataset.subject||"");return;}
 if(a==="nav"){view=b.dataset.view;subjectFilter="";searchQuery="";if(["home","library","review","profile"].includes(view))session=null;renderApp();return;}
 if(a==="open-subject"){subjectFilter=b.dataset.subject;searchQuery="";view="library";renderApp();return;}
 if(a==="subject-back"){subjectFilter="";renderApp();return;}
 if(a==="open-set"){setId=b.dataset.id;data.lastOpened=setId;save();view="set";renderApp();return;}
 if(a==="set-back"){subjectFilter=getSet(setId)?.subject||"";view="library";renderApp();return;}
 if(a==="open-topic"){topicId=b.dataset.topicId;view="topic";renderApp();return;}
 if(a==="topic-back"){view="set";renderApp();return;}
 if(a==="start-cards"){startCards(b.dataset.setId||setId,b.dataset.topicId||null);return;}
 if(a==="topic-cards"){startCards(setId,b.dataset.topicId);return;}
 if(a==="topic-quiz"){startQuiz(setId,b.dataset.topicId);return;}
 if(a==="start-quiz"){startQuiz(b.dataset.setId||setId,null);return;}
 if(a==="start-review"){startCards(null,null,dueCards());return;}
 if(a==="flip-card"){if(session&&session.kind==="cards"){session.flipped=!session.flipped;renderApp();}return;}
 if(a==="rate-card"){rateCard(b.dataset.rating);return;}
 if(a==="quiz-answer"){if(!session||session.kind!=="quiz"||session.answered)return;session.selectedIndex=Number(b.dataset.index);session.answered=true;session.responses.push({correct:session.selectedIndex===session.items[session.index].correctIndex});renderApp();return;}
 if(a==="quiz-next"){session.index++;session.answered=false;session.selectedIndex=-1;renderApp();return;}
 if(a==="quiz-retry"){startQuiz(session.setId,session.topicId);return;}
 if(a==="session-close"){endSession();return;}
 if(a==="edit-material"){openEditMaterial(b.dataset.id);return;}
 if(a==="remove-file"){pendingFiles.splice(Number(b.dataset.index),1);showFileList();return;}
 if(a==="modal-close"){closeModal();return;}
 if(a==="modal-backdrop"&&e.target===b){closeModal();return;}
 if(a==="export-data"){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="studypilot-lerndaten-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify("Backup exportiert.");return;}
 if(a==="import-data"){$("backup-file").click();return;}
 if(a==="reset-data"){if(confirm("Wirklich alle Lernsets, Karteikarten und Ergebnisse löschen? Exportiere vorher bei Bedarf ein Backup.")){data=baseData();save();view="home";renderApp();notify("Lerndaten gelöscht.");}return;}
}
function closeModal(){$("modal-root").innerHTML="";pendingFiles=[];processing=false;}
function updateSearch(){const input=$("library-search");if(!input)return;const q=input.value.toLocaleLowerCase("de");document.querySelectorAll("#set-results .set-card").forEach(c=>{c.style.display=c.textContent.toLocaleLowerCase("de").includes(q)?"":"none";});}
document.addEventListener("input",e=>{if(e.target.id==="library-search")updateSearch();});
document.addEventListener("change",e=>{
 if(e.target.id==="set-files"){pendingFiles=Array.from(e.target.files||[]);showFileList();}
 if(e.target.id==="backup-file"&&e.target.files&&e.target.files[0]){const f=e.target.files[0],r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||!obj.profile||!Array.isArray(obj.sets)||!obj.reviews)throw 0;if(!confirm("Das Backup ersetzt deine Lerndaten. Fortfahren?"))return;data=obj;if(!data.quizStats)data.quizStats={};save();view="home";renderApp();notify("Backup importiert.");}catch(e){notify("Backup ungültig oder beschädigt.");}e.target.value="";};r.readAsText(f);}
});
document.addEventListener("click",handleClick);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if((e.key==="Enter"||e.key===" ")&&e.target.matches(".flashcard")){e.preventDefault();session.flipped=!session.flipped;renderApp();}});
document.addEventListener("submit",async e=>{
 if(e.target.id==="setup-form"){e.preventDefault();data.profile.school=$("setup-school").value;data.profile.grade=Number($("setup-grade").value);data.profile.difficulty=$("setup-difficulty").value;data.profile.setupDone=true;if(!data.profile.subjects.length)data.profile.subjects=["Deutsch","Mathematik","Englisch"];save();view="home";renderApp();notify("Lernprofil eingerichtet.");return;}
 if(e.target.id==="profile-form"){e.preventDefault();data.profile.school=$("profile-school").value;data.profile.grade=Number($("profile-grade").value);data.profile.difficulty=$("profile-difficulty").value;save();renderApp();notify("Lernprofil gespeichert.");return;}
 if(e.target.id==="new-set-form"){
  e.preventDefault();if(processing)return;
  const title=$("set-title").value.trim(),subject=$("set-subject").value,exam=$("set-exam").value,topicInput=$("set-topics").value;let txt=$("set-notes").value.trim();const files=pendingFiles.slice();
  if(!title){notify("Gib dem Lernset einen Namen.");return;}if(!txt&&!files.length){notify("Füge eine Datei oder Text ein.");return;}
  processing=true;const btn=$("create-button");btn.disabled=true;const status=m=>{const n=$("create-status");if(n)n.textContent=m;};status("Lernmaterial wird vorbereitet …");
  try{let docs=[],errors=[];if(files.length){const r=await readFiles(files,status);txt=(txt+"\n\n"+r.text).trim();docs=r.names;errors=r.errors;}if(txt.length<25)throw new Error("Zu wenig lesbarer Text erkannt. Versuche ein schärferes Foto oder füge Text ein.");status("Erstelle Übersicht, Karteikarten und Quizfragen …");const s=makeSet({title,subject,exam,topicInput,text:txt,documents:docs,grade:data.profile.grade,difficulty:data.profile.difficulty});data.sets.unshift(s);data.lastOpened=s.id;const ok=save();closeModal();setId=s.id;view="set";renderApp();notify("Lernset erstellt: "+s.topics.length+" Themen, "+s.topics.reduce((n,t)=>n+t.cards.length,0)+" Karten und "+s.topics.reduce((n,t)=>n+t.questions.length,0)+" Fragen."+(ok?"":" Speicher prüfen."));if(errors.length)alert("Einige Dateien konnten nicht gelesen werden:\n"+errors.join("\n")+"\n\nDu kannst den Text über „Material bearbeiten“ ergänzen.");}
  catch(err){status(err.message||"Ein Fehler ist aufgetreten.");btn.disabled=false;notify("Lernset konnte nicht erstellt werden.");}
  finally{processing=false;}return;
 }
 if(e.target.id==="edit-form"){e.preventDefault();const old=getSet($("edit-id").value),txt=$("edit-content").value.trim(),title=$("edit-title").value.trim();if(!old||txt.length<25||!title){notify("Bitte gib einen Titel und mindestens 25 Zeichen Text ein.");return;}const s=makeSet({title,subject:old.subject,exam:old.exam,topicInput:(old.topicNames||[]).join("\n"),text:txt,documents:old.documents||[],grade:old.grade||data.profile.grade,difficulty:old.difficulty||data.profile.difficulty});s.id=old.id;s.createdAt=old.createdAt;data.sets=data.sets.map(x=>x.id===old.id?s:x);save();closeModal();setId=s.id;view="set";renderApp();notify("Lernmaterial neu erstellt.");return;}
});
if("serviceWorker" in navigator&&location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
renderApp();
</script>
