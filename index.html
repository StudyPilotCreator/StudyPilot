<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
const KEY="studypilot.v4.data";
const DAY_NAMES=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const DAY_SHORT=["Mo","Di","Mi","Do","Fr","Sa","So"];
const $=id=>document.getElementById(id);
let today=new Date(); today.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseDate=s=>{const p=String(s||iso(today)).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const deDate=d=>new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"}).format(d);
const monthName=d=>new Intl.DateTimeFormat("de-DE",{month:"long",year:"numeric"}).format(d);
const mondayIndex=d=>(d.getDay()+6)%7;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const timeM=s=>{const p=String(s||"00:00").split(":").map(Number);return p[0]*60+p[1];};
const addM=(time,duration)=>{const n=timeM(time)+Number(duration||0);return String(Math.floor(n/60)%24).padStart(2,"0")+":"+String(n%60).padStart(2,"0");};
const fmtTime=n=>String(Math.floor(n/60)%24).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
const validTime=s=>typeof s==="string"&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const isValidDateKey=s=>{if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=parseDate(s);return iso(d)===s;};
function defaultSchoolHours(){return DAY_NAMES.map((name,day)=>({day,enabled:day<5,start:"08:00",end:day===4?"13:00":"14:00"}));}
function normalizeSchool(input){
 const school=input&&typeof input==="object"?input:{};
 const defaults=defaultSchoolHours();
 let hours;
 if(Array.isArray(school.hours)){
  hours=defaults.map(fallback=>{
   const saved=school.hours.find(h=>Number(h.day)===fallback.day);
   if(!saved)return fallback;
   return {day:fallback.day,enabled:Boolean(saved.enabled),start:validTime(saved.start)?saved.start:fallback.start,end:validTime(saved.end)?saved.end:fallback.end};
  });
 }else{
  const days=Array.isArray(school.days)?school.days.map(Number):[0,1,2,3,4];
  const start=validTime(school.start)?school.start:"08:00";
  const end=validTime(school.end)?school.end:"13:00";
  hours=defaults.map(h=>({...h,enabled:days.includes(h.day),start,end}));
 }
 const active=hours.filter(h=>h.enabled);
 return {hours,days:active.map(h=>h.day),start:active[0]?.start||(validTime(school.start)?school.start:"08:00"),end:active[0]?.end||(validTime(school.end)?school.end:"13:00")};
}
function normalizeData(input){
 const defaults=defaultData();
 const raw=input&&typeof input==="object"&&!Array.isArray(input)?input:{};
 const result={...defaults,...raw};
 result.school=normalizeSchool(raw.school||defaults.school);
 result.routines=(Array.isArray(raw.routines)?raw.routines:[]).filter(r=>r&&typeof r==="object"&&String(r.title||"").trim()&&Number.isInteger(Number(r.day))&&Number(r.day)>=0&&Number(r.day)<=6&&validTime(r.start||r.time)).map(r=>({id:String(r.id??uid()),title:String(r.title).trim().slice(0,70),day:Number(r.day),start:r.start||r.time,duration:Math.min(600,Math.max(10,Number(r.duration)||60)),category:String(r.category||"Sport"),emoji:String(r.emoji||"✦")}));
 result.tasks=(Array.isArray(raw.tasks)?raw.tasks:[]).filter(t=>t&&typeof t==="object"&&String(t.title||"").trim()&&isValidDateKey(t.date)).map(t=>({id:String(t.id??uid()),title:String(t.title).trim().slice(0,100),date:t.date,duration:Math.min(600,Math.max(5,Number(t.duration)||25)),priority:["Hoch","Mittel","Niedrig"].includes(t.priority)?t.priority:"Mittel",done:Boolean(t.done)}));
 result.events=(Array.isArray(raw.events)?raw.events:[]).filter(e=>e&&typeof e==="object"&&String(e.title||"").trim()&&isValidDateKey(e.date)&&validTime(e.start)).map(e=>({id:String(e.id??uid()),title:String(e.title).trim().slice(0,100),date:e.date,start:e.start,duration:Math.min(720,Math.max(5,Number(e.duration)||60)),end:addM(e.start,Math.min(720,Math.max(5,Number(e.duration)||60))),category:String(e.category||"Termin"),notes:String(e.notes||"").slice(0,240)}));
 result.setupDone=Boolean(raw.setupDone);
 result.introSeen=Boolean(raw.introSeen);
 result.selectedDate=isValidDateKey(raw.selectedDate)?raw.selectedDate:iso(today);
 return result;
}
const defaultData=()=>({setupDone:false,school:{days:[0,1,2,3,4],start:"08:00",end:"14:00",hours:defaultSchoolHours()},routines:[],tasks:[],events:[],selectedDate:iso(today),introSeen:false});
let data;
try{data=normalizeData(JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){data=defaultData();}
let setupStep=0;
let draftSchool=JSON.parse(JSON.stringify(data.school));
let draftRoutines=Array.isArray(data.routines)?data.routines.slice():[];
let currentView="today";
let visibleMonth=new Date(today.getFullYear(),today.getMonth(),1);
let selectedDate=data.selectedDate||iso(today);
let toastTimer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageError=false;return true;}catch(e){storageError=true;return false;}}
let storageError=false;
function notify(msg){if(storageError)msg+=" · Lokales Speichern fehlgeschlagen — exportiere ein Backup.";const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),3200);}
function setDate(s){selectedDate=s;data.selectedDate=s;save();}
function button(label,action,cls){return '<button class="btn '+(cls||"")+'" data-action="'+action+'">'+label+'</button>';}
function field(label,id,type,value,attrs,full){return '<div class="field '+(full?"full":"")+'"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+esc(value||"")+'" '+(attrs||"")+'></div>';}
function dayChecks(selected){return '<div class="days">'+DAY_NAMES.map((n,i)=>'<label class="day-toggle"><input type="checkbox" class="day-check" value="'+i+'" '+(selected.includes(i)?"checked":"")+'>'+DAY_SHORT[i]+'</label>').join("")+'</div>';}
function schoolRows(hours,prefix){

function readSchoolFrom(root,previous){

 const hours=DAY_NAMES.map((name,day)=>{
  const old=oldHours.find(h=>Number(h.day)===day)||defaultSchoolHours()[day];
  const check=root.querySelector('[data-school-enabled="'+day+'"]');
  const start=root.querySelector('[data-school-field="start"][data-day="'+day+'"]');
  const end=root.querySelector('[data-school-field="end"][data-day="'+day+'"]');
  return {day,enabled:check?check.checked:Boolean(old.enabled),start:start?start.value:old.start,end:end?end.value:old.end};
 });
 const active=hours.filter(h=>h.enabled);
 if(!active.length)return {error:"Wähle mindestens einen Schultag aus."};

 return {school:{hours,days:active.map(h=>h.day),start:active[0].start,end:active[0].end}};
}

function getPlanConflicts(dateString){
 const items=allItems(dateString).map(it=>({title:it.title,start:timeM(it.start),end:timeM(it.end)})).filter(it=>Number.isFinite(it.start)&&Number.isFinite(it.end)&&it.end>it.start).sort((a,b)=>a.start-b.start);
 const conflicts=[];
 for(let i=0;i<items.length;i++){
  for(let j=i+1;j<items.length;j++){
   if(items[j].start>=items[i].end)break;
   if(items[i].start<items[j].end&&items[j].start<items[i].end)conflicts.push(items[i].title+" überschneidet sich mit "+items[j].title);
  }
 }
 return conflicts;
}
function autoPlan(dateString){
 const now=new Date();
 const baseStart=dateString===iso(today)?Math.max(7*60,now.getHours()*60+now.getMinutes()+5):7*60;
 const day=mondayIndex(parseDate(dateString));
 const schoolDay=(data.school.hours||[]).find(h=>Number(h.day)===day&&h.enabled);
 // On school days, do not suggest tasks before classes. Leave a small reset buffer after school.
 const startAt=schoolDay?Math.max(baseStart,timeM(schoolDay.end)+10):baseStart;
 const endAt=22*60;
 const fixed=allItems(dateString)
  .map(it=>({start:Math.max(0,timeM(it.start)-10),end:Math.min(endAt,timeM(it.end)+10)}))
  .filter(it=>Number.isFinite(it.start)&&Number.isFinite(it.end)&&it.end>it.start&&it.end>startAt&&it.start<endAt)
  .sort((a,b)=>a.start-b.start);
 const slots=[];
 let cursor=Math.min(startAt,endAt);
 for(const block of fixed){
  if(block.end<=cursor)continue;
  if(block.start>cursor)slots.push({start:cursor,end:Math.min(block.start,endAt),tasksInSlot:0});
  cursor=Math.max(cursor,block.end);
  if(cursor>=endAt)break;
 }
 if(cursor<endAt)slots.push({start:cursor,end:endAt,tasksInSlot:0});

 const rank={Hoch:0,Mittel:1,Niedrig:2};
 const pending=tasksFor(dateString)
  .filter(t=>!t.done)
  .slice()
  .sort((a,b)=>(rank[a.priority]??1)-(rank[b.priority]??1)||Number(a.duration||25)-Number(b.duration||25));
 const scheduled=[];
 // Fill free windows chronologically. Within each window choose the highest-priority
 // task that fits, so a short task can use a short gap instead of leaving it unused.
 for(const slot of slots){
  while(slot.end-slot.start>=5&&pending.length){
   const available=pending.findIndex(task=>Math.max(5,Number(task.duration||25))<=slot.end-slot.start);
   if(available<0)break;
   const task=pending.splice(available,1)[0];
   const duration=Math.max(5,Number(task.duration||25));
   const start=slot.start;
   const end=start+duration;
   const canTakeBreak=(slot.tasksInSlot+1)%2===0&&slot.end-end>=5;
   scheduled.push({task,start,end,breakAfter:canTakeBreak});
   slot.tasksInSlot++;
   slot.start=end+(canTakeBreak?5:0);
  }
 }
 return {scheduled,unscheduled:pending,conflicts:getPlanConflicts(dateString),openCount:tasksFor(dateString).filter(t=>!t.done).length};
}
function renderAutoPlan(dateString){
 const plan=autoPlan(dateString);
 const conflictHtml=plan.conflicts.length?'<div class="plan-alert">⚠️ '+plan.conflicts.map(esc).join("<br>")+' — prüfe, ob die Zeiten stimmen.</div>':"";
 const lines=plan.scheduled.map(item=>'<div class="plan-line"><div class="plan-time">'+fmtTime(item.start)+'–'+fmtTime(item.end)+'</div><div style="flex:1;min-width:0"><div class="plan-task">'+esc(item.task.title)+' <span class="plan-badge">'+esc(item.task.priority||"Mittel")+'</span></div><div class="plan-detail">'+Number(item.task.duration||25)+' Minuten'+(item.breakAfter?' · danach 5 Minuten Pause':'')+'</div></div></div>').join("");
 let tail="";
 if(plan.openCount===0)tail='<div class="plan-success">✨ Alles erledigt! Du hast gerade keine offenen Aufgaben für diesen Tag.</div>';
 else if(plan.unscheduled.length)tail='<div class="plan-alert">'+plan.unscheduled.length+' Aufgabe(n) passen nicht vollständig in freie Zeit bis 22:00 Uhr. Prüfe deine Termine oder plane Aufgaben auf einen anderen Tag.</div>';
 if(plan.scheduled.length===0&&plan.openCount>0)tail+='<div class="empty">Es gibt kein ausreichend langes freies Zeitfenster für deine offenen Aufgaben. Prüfe deine Termine oder verschiebe Aufgaben auf einen anderen Tag.</div>';
 return '<section class="panel glass auto-plan"><div class="auto-plan-head"><div><h2>Dein automatischer Plan</h2><div class="small-text" style="margin-top:4px">Freie Zeit zwischen festen Terminen</div></div><button class="btn small primary" data-action="auto-plan">↻ Neu berechnen</button></div><div class="plan-note">Der Vorschlag füllt freie Zeit chronologisch. Prioritäten werden berücksichtigt, feste Termine bleiben unverändert. Nach jeweils zwei Aufgaben im selben Zeitfenster wird eine kurze Pause vorgesehen, wenn genug Zeit bleibt.</div>'+conflictHtml+(lines?'<div>'+lines+'</div>':"")+tail+'</section>';
}

function modal(html){const old=document.querySelector(".modal-backdrop");if(old)old.remove();document.body.insertAdjacentHTML("beforeend",'<div class="modal-backdrop" data-action="modal-close-backdrop"><section class="modal glass" role="dialog" aria-modal="true">'+html+'</section></div>');}
function closeModal(){const el=document.querySelector(".modal-backdrop");if(el)el.remove();}
function openNewMenu(){modal('<h2>Was möchtest du hinzufügen?</h2><p>Wähle aus, was in deinen persönlichen Plan soll.</p><div class="choice-grid"><button class="choice" data-action="new-task"><span>✅</span><strong>Aufgabe</strong></button><button class="choice" data-action="new-event"><span>📅</span><strong>Termin</strong></button><button class="choice" data-action="new-routine"><span>🔁</span><strong>Routine</strong></button></div><div class="form-actions"><button class="btn" data-action="modal-close">Schließen</button></div>');}
function openTaskForm(){
modal('<h2>Neue Aufgabe</h2><p>Trage ein, was du erledigen möchtest.</p><form id="task-form"><div class="form-grid">'+field("Aufgabe","task-title","text","","required maxlength=\"100\" placeholder=\"z. B. Mathe lernen\"",true)+field("Datum","task-date","date",selectedDate,"required",true)+field("Dauer (Minuten)","task-duration","number","25","min=\"5\" max=\"600\" step=\"5\" required",false)+'<div class="field"><label for="task-priority">Priorität</label><select id="task-priority"><option>Hoch</option><option selected>Mittel</option><option>Niedrig</option></select></div></div><div class="form-actions"><button class="btn" type="button" data-action="modal-close">Abbrechen</button><button class="btn mint" type="submit">Aufgabe speichern</button></div></form>');
}
function openEventForm(){
modal('<h2>Neuer Termin</h2><p>Ein einmaliger Termin wird am ausgewählten Datum in deinem Kalender angezeigt.</p><form id="event-form"><div class="form-grid">'+field("Termin","event-title","text","","required maxlength=\"100\" placeholder=\"z. B. Zahnarzt\"",true)+field("Datum","event-date","date",selectedDate,"required",true)+field("Beginn","event-start","time","16:00","required",false)+field("Dauer (Minuten)","event-duration","number","60","min=\"5\" max=\"720\" step=\"5\" required",false)+'<div class="field full"><label for="event-category">Kategorie</label><select id="event-category"><option>Termin</option><option>Schule</option><option>Sport</option><option>Familie</option><option>Freizeit</option><option>Sonstiges</option></select></div><div class="field full"><label for="event-notes">Notiz (optional)</label><textarea id="event-notes" maxlength="240" placeholder="Ort oder weitere Infos"></textarea></div></div><div class="form-actions"><button class="btn" type="button" data-action="modal-close">Abbrechen</button><button class="btn mint" type="submit">Termin speichern</button></div></form>');
}
function openRoutineForm(){
modal('<h2>Wiederkehrende Aktivität</h2><p>Diese Aktivität wird jede Woche am gewählten Wochentag im Kalender angezeigt.</p><form id="routine-form"><div class="form-grid">'+field("Aktivität","routine-title","text","","required maxlength=\"70\" placeholder=\"z. B. Schwimmtraining\"",true)+'<div class="field"><label for="routine-day">Wochentag</label><select id="routine-day">'+DAY_NAMES.map((n,i)=>'<option value="'+i+'" '+(i===mondayIndex(parseDate(selectedDate))?"selected":"")+'>'+n+'</option>').join("")+'</select></div>'+field("Beginn","routine-start","time","17:00","required",false)+field("Dauer (Minuten)","routine-duration","number","60","min=\"10\" max=\"600\" step=\"5\" required",false)+'<div class="field full"><label for="routine-category">Kategorie</label><select id="routine-category"><option>Sport</option><option>Musik</option><option>Verein</option><option>Familie</option><option>Sonstiges</option></select></div></div><div class="form-actions"><button class="btn" type="button" data-action="modal-close">Abbrechen</button><button class="btn mint" type="submit">Routine speichern</button></div></form>');
}
function collectDayChecks(root){return Array.from(root.querySelectorAll(".day-check:checked")).map(el=>Number(el.value));}
function finishSetup(){data.school=normalizeSchool(draftSchool);data.routines=draftRoutines;data.setupDone=true;data.selectedDate=iso(today);const persisted=save();currentView="today";renderApp();notify(persisted?"Willkommen bei StudyPilot! ✨":"Dein Plan ist geöffnet, aber nicht dauerhaft gespeichert. Bitte exportiere ein Backup.");}
document.addEventListener("click",function(e){
const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;
if(a==="setup-next"){if(setupStep===1){const result=readSchoolFrom($("root"),draftSchool);if(result.error){notify(result.error);return;}draftSchool=result.school;}setupStep=Math.min(3,setupStep+1);renderSetup();}
else if(a==="setup-back"){setupStep=Math.max(0,setupStep-1);renderSetup();}
else if(a==="setup-finish")finishSetup();
else if(a==="draft-delete"){draftRoutines=draftRoutines.filter(r=>r.id!==b.dataset.id);renderSetup();}
else if(a==="nav"){currentView=b.dataset.view;renderApp();}
else if(a==="new-menu")openNewMenu();
else if(a==="new-task"){closeModal();openTaskForm();}
else if(a==="new-event"){closeModal();openEventForm();}
else if(a==="new-routine"){closeModal();openRoutineForm();}
else if(a==="modal-close")closeModal();
else if(a==="modal-close-backdrop"&&e.target===b)closeModal();
else if(a==="task-toggle"){const t=data.tasks.find(t=>t.id===b.dataset.id);if(t)t.done=!t.done;save();renderApp();}
else if(a==="task-delete"){data.tasks=data.tasks.filter(t=>t.id!==b.dataset.id);save();renderApp();notify("Aufgabe gelöscht.");}
else if(a==="event-delete"){data.events=data.events.filter(t=>t.id!==b.dataset.id);save();renderApp();notify("Termin gelöscht.");}
else if(a==="auto-plan"){renderApp();notify("Tagesplan neu berechnet.");}
else if(a==="routine-delete"){data.routines=data.routines.filter(r=>r.id!==b.dataset.id);save();renderApp();notify("Aktivität entfernt.");}
else if(a==="select-date"){setDate(b.dataset.date);visibleMonth=new Date(parseDate(selectedDate).getFullYear(),parseDate(selectedDate).getMonth(),1);renderApp();}
else if(a==="month-prev"){visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()-1,1);renderApp();}
else if(a==="month-next"){visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()+1,1);renderApp();}
else if(a==="month-today"){visibleMonth=new Date(today.getFullYear(),today.getMonth(),1);setDate(iso(today));renderApp();}
else if(a==="edit-school"){currentView="settings";renderApp();}
else if(a==="export-data"){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download="studypilot-backup.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify("Backup wurde erstellt.");}
else if(a==="import-data"){$("import-file").click();}
else if(a==="restart-setup"){draftSchool=JSON.parse(JSON.stringify(data.school));draftRoutines=data.routines.slice();setupStep=0;data.setupDone=false;save();renderSetup();}
});
document.addEventListener("submit",function(e){
if(e.target.id==="setup-routine-form"){e.preventDefault();const title=$("draft-title").value.trim(),days=collectDayChecks(e.target),start=$("draft-start").value,duration=Number($("draft-duration").value);if(!title||!days.length||!start||!duration||duration<10||duration>600){notify("Bitte Titel, Tage, Startzeit und Dauer prüfen.");return;}if(timeM(start)+duration>=1440){notify("Die Aktivität muss vor Mitternacht enden.");return;}days.forEach(day=>draftRoutines.push({id:uid(),title,day,start,duration,category:$("draft-category").value,emoji:$("draft-category").value==="Sport"?"⚽":$("draft-category").value==="Musik"?"🎵":"✦"}));renderSetup();notify("Aktivität hinzugefügt.");}
if(e.target.id==="task-form"){e.preventDefault();const title=$("task-title").value.trim(),date=$("task-date").value,duration=Number($("task-duration").value);if(!title||!date||!Number.isFinite(duration)||duration<5||duration>600){notify("Bitte kontrolliere Titel, Datum und Dauer.");return;}data.tasks.push({id:uid(),title,date,duration,priority:$("task-priority").value,done:false});setDate(date);closeModal();save();renderApp();notify("Aufgabe gespeichert.");}
if(e.target.id==="event-form"){e.preventDefault();const title=$("event-title").value.trim(),date=$("event-date").value,start=$("event-start").value,duration=Number($("event-duration").value);if(!title||!date||!validTime(start)||!Number.isFinite(duration)||duration<5||duration>720){notify("Bitte kontrolliere Titel, Datum, Uhrzeit und Dauer.");return;}if(timeM(start)+duration>=1440){notify("Der Termin muss vor Mitternacht enden. Teile längere Termine bitte auf zwei Einträge auf.");return;}data.events.push({id:uid(),title,date,start,end:addM(start,duration),duration,category:$("event-category").value,notes:$("event-notes").value.trim()});setDate(date);visibleMonth=new Date(parseDate(date).getFullYear(),parseDate(date).getMonth(),1);closeModal();save();renderApp();notify("Termin gespeichert.");}
if(e.target.id==="routine-form"){e.preventDefault();const title=$("routine-title").value.trim(),day=Number($("routine-day").value),start=$("routine-start").value,duration=Number($("routine-duration").value),category=$("routine-category").value;if(!title||!validTime(start)||!Number.isFinite(duration)||duration<10||duration>600){notify("Bitte kontrolliere Titel, Uhrzeit und Dauer.");return;}if(timeM(start)+duration>=1440){notify("Die Aktivität muss vor Mitternacht enden.");return;}data.routines.push({id:uid(),title,day,start,duration,category,emoji:category==="Sport"?"⚽":category==="Musik"?"🎵":"✦"});closeModal();save();renderApp();notify("Wöchentliche Aktivität gespeichert.");}
if(e.target.id==="school-edit-form"){e.preventDefault();const result=readSchoolFrom(e.target,data.school);if(result.error){notify(result.error);return;}data.school=result.school;const persisted=save();renderApp();notify(persisted?"Stundenplan aktualisiert.":"Speichern fehlgeschlagen. Exportiere deine Daten als Backup.");}
});
document.addEventListener("change",function(e){
 if(e.target.matches("[data-school-enabled]")){
  const day=e.target.dataset.schoolEnabled;
  document.querySelectorAll('[data-school-field][data-day="'+day+'"]').forEach(input=>{input.disabled=!e.target.checked;});
 }
 if(e.target.id==="import-file"&&e.target.files&&e.target.files[0]){
  const f=e.target.files[0],reader=new FileReader();
  reader.onload=()=>{
   try{
    const imported=JSON.parse(reader.result);
    if(!imported||!imported.school||!Array.isArray(imported.tasks)||!Array.isArray(imported.routines)||!Array.isArray(imported.events))throw new Error("bad");
    if(!window.confirm("Das Backup ersetzt den aktuell gespeicherten Wochenplan, die Aufgaben und Termine. Möchtest du fortfahren?")){e.target.value="";return;}
    data=normalizeData(imported);selectedDate=data.selectedDate;visibleMonth=new Date(parseDate(selectedDate).getFullYear(),parseDate(selectedDate).getMonth(),1);
    const persisted=save();renderApp();notify(persisted?"Backup importiert.":"Backup geladen, aber nicht dauerhaft gespeichert.");
   }catch(err){notify("Diese Backup-Datei ist ungültig oder beschädigt.");}
   e.target.value="";
  };
  reader.onerror=()=>{notify("Die Backup-Datei konnte nicht gelesen werden.");e.target.value="";};
  reader.readAsText(f);
 }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
renderApp();
function refreshCurrentDay(){
 const current=new Date();current.setHours(0,0,0,0);
 if(iso(current)===iso(today))return;
 const previous=iso(today);today=current;
 if(selectedDate===previous){selectedDate=iso(today);data.selectedDate=selectedDate;visibleMonth=new Date(today.getFullYear(),today.getMonth(),1);save();}
 renderApp();
}
window.addEventListener("focus",refreshCurrentDay);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshCurrentDay();});
window.setInterval(refreshCurrentDay,60000);
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
})();
</script>
</body>
</html>
